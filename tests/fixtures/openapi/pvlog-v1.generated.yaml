      parameters:
        - name: principalType
          in: query
          required: true
          schema: { type: string, enum: [user, api_credential] }
        - name: principalId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "200":
          description: Active role assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleAssignment" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    post:
      operationId: assignAccountRole
      tags: [Administration]
      summary: Assign a role to a user or API credential at account or system scope
      description: Creates an account- or system-scoped assignment after delegation validation.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/RoleAssignmentInput" } },
          }
      responses:
        "201": { $ref: "#/components/responses/RoleAssignmentResponse" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/accounts/{account_id}/role-assignments/{assignment_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/RoleAssignmentId"
    delete:
      operationId: revokeAccountRoleAssignment
      tags: [Administration]
      summary: Revoke a role assignment
      description: Revokes an account- or system-scoped assignment after server-side authorization.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: systemId
          in: query
          schema: { $ref: "#/components/schemas/UuidV7" }
      responses:
        "204": { description: Role assignment revoked }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pvlog_session
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UuidV7" }
    DeviceEventFrom:
      name: from
      in: query
      description: Only events that occurred at or after this instant, in epoch milliseconds.
      schema: { type: integer, format: int64 }
    DeviceEventTo:
      name: to
      in: query
      description: Only events that occurred before this instant, in epoch milliseconds.
      schema: { type: integer, format: int64 }
    DeviceEventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    DiscoveryProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UuidV7" }
    SystemId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    AccountId:
      {
        name: account_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    RoleId:
      {
        name: role_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    RoleAssignmentId:
      {
        name: assignment_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when authenticating with the session cookie; ignored for bearer API keys.
      schema: { type: string, minLength: 1 }
    CsrfToken:
      {
        name: X-CSRF-Token,
        in: header,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    NestedSystemId:
      {
        name: system_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    DataSourceId:
      name: data_source_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UuidV7" }
    InverterId:
      name: inverter_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UuidV7" }
    StringId:
      name: string_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UuidV7" }
    InverterScopeId:
      name: inverterId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UuidV7" }
      description: Selects an inverter scope; required when stringId is supplied.
    StringScopeId:
      name: stringId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/UuidV7" }
      description: Selects a measured PV-string scope together with inverterId.
    ObservationId:
      {
        name: observation_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      description: Opaque account API-key metadata identifier; this is not the bearer secret.
      schema: { $ref: "#/components/schemas/UuidV7" }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string },
        example: '"3"',
      }
    IfNoneMatch:
      {
        name: If-None-Match,
        in: header,
        required: false,
        schema: { type: string },
        example: '"query-7f4a"',
      }
    StartEpochMillis:
      {
        name: startEpochMillis,
        in: query,
        required: true,
        schema: { type: integer, format: int64 },
        description: Inclusive UTC range start in Unix epoch milliseconds.,
      }
    EndEpochMillis:
      {
        name: endEpochMillis,
        in: query,
        required: true,
        schema: { type: integer, format: int64 },
        description: Exclusive UTC range end in Unix epoch milliseconds.,
      }
    SeriesFields:
      {
        name: fields,
        in: query,
        required: true,
        schema: { type: string, minLength: 1 },
        example: "generation_power,consumption_power",
      }
    SeriesResolution:
      {
        name: resolution,
        in: query,
        required: false,
        schema:
          { enum: [auto, raw, 15m, hour, day, month, year], default: auto },
      }
    Timezone:
      {
        name: timezone,
        in: query,
        required: false,
        schema: { type: string, default: UTC },
        description: IANA timezone used for calendar buckets and DST boundaries.,
        example: Europe/Berlin,
      }
    MaximumPoints:
      {
        name: maximumPoints,
        in: query,
        required: false,
        schema: { type: integer, minimum: 1, maximum: 10000, default: 2000 },
        description: Hard per-series point budget; responses may include at most two documented boundary points.,
      }
    YieldResolution:
      name: resolution
      in: query
      required: false
      schema: { enum: [15m, hour, day], default: hour }
      description: Modeled values use half-open UTC intervals at the selected resolution.
    YieldMaximumPoints:
      name: maximumPoints
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 2000 }
      description: Hard modeled-series point bound; oversized requests fail instead of downsampling silently.
  requestBodies:
    ManagedResource:
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
          example: { name: Example resource }
    ForecastSettings:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForecastSettingsInput" }
          examples:
            effectiveLosses:
              value:
                effectiveFrom: 1780000000000
                effectiveTo: null
                modelIdentifier: pvwatts-compatible
                modelRevision: 1
                losses:
                  soilingBasisPoints: 200
                  shadingBasisPoints: 300
                  mismatchBasisPoints: 100
                  wiringBasisPoints: 100
                  unavailabilityBasisPoints: 50
                calibrationBasisPoints: 0
  responses:
    Problem:
      description: Request rejected with a standards-based problem detail
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IngestProblem:
      description: The request was refused and nothing of it was stored. The detail names the member or limit; rejected lists every item that cannot be stored.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/IngestProblem" }
    IssuedDataSource:
      description: Data source with its one-time uploader configuration. The response must not be cached.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IssuedDataSource" }
    SystemResponse:
      description: Versioned system representation
      headers: { ETag: { schema: { type: string } } }
      content:
        {
          application/json: { schema: { $ref: "#/components/schemas/System" } },
        }
    ManagedResource:
      description: Versioned managed resource
      headers: { ETag: { schema: { type: string } } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ManagedResource" } },
        }
    ResourceList:
      description: Managed resource collection
      content:
        {
          application/json:
            {
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/ManagedResource" },
                },
            },
        }
    ValidationProblem:
      {
        description: Request validation failed,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    ForecastSettingsResponse:
      description: Effective forecast settings with an optimistic-concurrency validator
      headers:
        ETag:
          { schema: { type: string }, description: Quoted settings version. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForecastSettings" }
    ForecastCompletenessResponse:
      description: Effective forecast-input completeness with a configuration validator
      headers:
        ETag:
          {
            schema: { type: string },
            description: Quoted effective-configuration version.,
          }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ForecastInputCompleteness" }
    ForecastValidationProblem:
      description: Forecast field, range, resolution, scope, or partial-result policy is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ForecastProblem" }
    QueryTooLargeProblem:
      description: The modeled range would exceed the documented point or time bound
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ForecastUnavailableProblem:
      description: No permitted fresh or explicitly stale weather run can satisfy this request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionProblem:
      {
        description: ETag precondition failed,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    ForbiddenProblem:
      {
        description: Required scope is missing,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    UnauthorizedProblem:
      {
        description: Authentication is required or the supplied credential was rejected,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    RateLimitProblem:
      description: The authenticated principal exceeded its ingestion request quota.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        RateLimit-Limit: { schema: { type: integer, minimum: 1 } }
        RateLimit-Remaining: { schema: { type: integer, minimum: 0 } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RoleResponse:
      description: Versioned custom or built-in role
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Role" } } }
    RoleAssignmentResponse:
      description: Created role assignment
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/RoleAssignment" } },
        }
    ConflictProblem:
      {
        description: Optimistic concurrency conflict,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotFoundProblem:
      {
        description: Notification resource was not found,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    OverloadProblem:
      {
        description: Ingestion is temporarily saturated,
        headers: { Retry-After: { schema: { type: integer, minimum: 1 } } },
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    QueryProblem:
      {
        description: "Query bounds, fields, resolution, timezone, or point budget are invalid.",
        content:
          {
            application/problem+json:
              {
                schema: { $ref: "#/components/schemas/Problem" },
                example:
                  {
                    type: https://pvlog.example/problems/query,
                    title: Invalid analytics query,
                    status: 422,
                    detail: The raw query exceeds maximumPoints.,
                    requestId: 019505c8-7c85-7f0b-9bc3-2a3c4d5e6f70,
                  },
              },
          },
      }
    RequiresAsyncProblem:
      {
        description: The requested export is too large for synchronous processing; retry with asynchronous true.,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotAcceptable:
      description: Requested response representation is not available
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Unexpected server failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailableProblem:
      description: A required dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CurrentUserProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    UpdateCurrentUserProfile:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
    ChangePassword:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          { type: string, format: password, minLength: 1, writeOnly: true }
        newPassword:
          {
            type: string,
            format: password,
            minLength: 12,
            maxLength: 128,
            writeOnly: true,
          }
    AccountApiKeyScope:
      type: string
      description: Explicit action permission. Scopes are independent and never imply another scope.
      enum: [systems:read, systems:write, telemetry:read, telemetry:write]
    CreateAccountApiKey:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccountApiKeyScope" }
        expiresAtEpochMillis:
          type: [integer, "null"]
          format: int64
          description: Optional future expiry as Unix epoch milliseconds.
    AccountApiKey:
      type: object
      additionalProperties: false
      required: [id, name, scopes, createdAtEpochMillis]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string }
        scopes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccountApiKeyScope" }
        createdAtEpochMillis: { type: integer, format: int64 }
        expiresAtEpochMillis: { type: [integer, "null"], format: int64 }
        revokedAtEpochMillis: { type: [integer, "null"], format: int64 }
        systemId:
          anyOf: [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
          description: System the key is restricted to; null for an account-wide key.
        dataSourceId:
          anyOf: [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
          description: Data source that owns the key. Such a key is created and regenerated through its data source and can only be revoked here.
    IssuedAccountApiKey:
      type: object
      additionalProperties: false
      required: [apiKey, credential]
      properties:
        apiKey:
          type: string
          minLength: 40
          writeOnly: true
          description: One-time cleartext bearer key. Copy it before dismissing the response.
        credential: { $ref: "#/components/schemas/AccountApiKey" }
    DataState:
      type: string
      enum: [none, current, stale]
      description: none while no real reading is stored; current when the latest reading arrived within three status intervals; stale otherwise. Clients must not present values as live unless the state is current.
    SetupStatus:
      type: object
      required: [systemId, items, dataState]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        dataState: { $ref: "#/components/schemas/DataState" }
        lastReceivedAtEpochMillis: { type: [integer, "null"], format: int64 }
        items:
          type: array
          description: Items in the order location, capacity, data_source, first_data, channels, equipment, tariff, forecast.
          items:
            type: object
            required: [key, state]
            properties:
              key:
                type: string
                enum:
                  [
                    location,
                    capacity,
                    data_source,
                    first_data,
                    channels,
                    equipment,
                    tariff,
                    forecast,
                  ]
              state:
                type: string
                enum: [done, recommended, optional, blocked]
              reason:
                type: string
                description: Machine-readable reason the item is not done, for example data_source_missing, waiting_for_first_reading or unassigned_channels.
              count:
                type: integer
                minimum: 0
                description: Number of things the reason refers to, such as unassigned channels.
    FirstData:
      type: object
      required: [systemId, received]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        received:
          type: boolean
          description: True once a reading that is not a test reading is stored.
        reading:
          anyOf:
            - type: object
              required: [id, measuredAtEpochMillis, receivedAtEpochMillis, test]
              properties:
                id: { $ref: "#/components/schemas/UuidV7" }
                measuredAtEpochMillis: { type: integer, format: int64 }
                receivedAtEpochMillis: { type: integer, format: int64 }
                generationPowerWatts: { type: [integer, "null"], format: int64 }
                generationEnergyWh: { type: [integer, "null"], format: int64 }
                consumptionPowerWatts:
                  { type: [integer, "null"], format: int64 }
                consumptionEnergyWh: { type: [integer, "null"], format: int64 }
                message:
                  type: [string, "null"]
                  maxLength: 30
                  description: Short text the source attached to the reading.
                dataSourceId:
                  anyOf:
                    [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
                dataSourceName: { type: [string, "null"] }
                test:
                  type: boolean
                  description: True for a reading that only proves the connection.
            - type: "null"
    SourceProfile:
      type: object
      required: [id, displayName, issuesCredential, snippetKinds, channelKeys]
      properties:
        id: { type: string, example: smalog }
        displayName: { type: string }
        issuesCredential:
          type: boolean
          description: Whether creating a data source of this profile issues an upload credential.
        snippetKinds:
          type: array
          items: { type: string }
          description: Identifiers of the configuration snippets rendered for this profile.
        channelKeys:
          type: array
          items: { $ref: "#/components/schemas/ProfileChannelKey" }
          description: Measurement channel keys a source of this profile sends. A key that matches one of them is registered with the definition given here instead of a definition guessed from its first value. Empty for profiles without well-known keys.
    ProfileChannelKey:
      type: object
      required: [key, valueType, unit, scale, targetKind, aggregation]
      properties:
        key:
          type: string
          description: Key pattern. `{serial}` stands for the inverter serial, `{phase}` for the AC phase 1 to 3 and `{tracker}` for the MPPT tracker number 1 to 255.
          example: "inv.{serial}.mppt.{tracker}.power"
        valueType:
          type: string
          enum: [integer, decimal, boolean, counter]
        unit:
          type: string
          description: Unit of the stored integer, as the logger records it. `code` marks a numeric status code.
          example: mV
        scale:
          type: integer
          minimum: 0
          maximum: 9
          description: Decimal places of the stored integer.
        targetKind:
          type: string
          enum: [inverter, string]
          description: Equipment the channel belongs to once that equipment is known.
        aggregation: { $ref: "#/components/schemas/ChannelAggregation" }
        statusLabels:
          type: array
          description: Meaning of the codes a status channel reports. Absent for measurements. A code that is not listed is shown as its number.
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: integer, example: 307 }
              label: { type: string, example: Ok }
    CreateDataSource:
      type: object
      additionalProperties: false
      required: [name, profile]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        profile:
          type: string
          description: Identifier of a profile returned by the source profile catalog.
    RenameDataSource:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    DataSource:
      type: object
      required:
        [
          id,
          systemId,
          name,
          profile,
          state,
          serverUrl,
          readingsLastDay,
          createdAtEpochMillis,
          updatedAtEpochMillis,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        systemId: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string }
        profile: { type: string }
        state:
          type: string
          enum: [never_connected, receiving, stale, disconnected]
          description: never_connected until the first accepted reading; stale when the last reading was received more than three status intervals ago; disconnected when the credential is revoked or expired.
        serverUrl:
          type: string
          format: uri
          description: Address uploaders send to.
        credentialId:
          anyOf: [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
          description: Identifier of the credential issued for this source. The secret is never returned here.
        lastReadingAtEpochMillis:
          type: [integer, "null"]
          format: int64
          description: Measurement time of the newest accepted reading.
        lastReceivedAtEpochMillis: { type: [integer, "null"], format: int64 }
        readingsLastDay: { type: integer, minimum: 0 }
        createdAtEpochMillis: { type: integer, format: int64 }
        updatedAtEpochMillis: { type: integer, format: int64 }
    DataSourceConfiguration:
      type: object
      description: Uploader configuration containing the cleartext credential. Returned once and never retrievable again.
      required: [serverUrl, systemId, apiKey, snippets]
      properties:
        serverUrl: { type: string, format: uri }
        systemId: { $ref: "#/components/schemas/UuidV7" }
        apiKey:
          type: string
          description: Cleartext upload credential. It can only write telemetry for this system.
        snippets:
          type: array
          items:
            type: object
            required: [id, title, language, content]
            properties:
              id: { type: string }
              title: { type: string }
              language: { type: string }
              content:
                type: string
                description: Configuration with every value filled in, usable without editing.
    IssuedDataSource:
      type: object
      required: [dataSource]
      properties:
        dataSource: { $ref: "#/components/schemas/DataSource" }
        configuration:
          anyOf:
            - $ref: "#/components/schemas/DataSourceConfiguration"
            - type: "null"
          description: Absent for profiles that need no credential.
    TestReading:
      type: object
      required:
        [
          id,
          systemId,
          measuredAtEpochMillis,
          receivedAtEpochMillis,
          values,
          test,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        systemId: { $ref: "#/components/schemas/UuidV7" }
        dataSourceId:
          anyOf: [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
        measuredAtEpochMillis: { type: integer, format: int64 }
        receivedAtEpochMillis: { type: integer, format: int64 }
        values: { type: object, additionalProperties: true }
        test: { type: boolean, const: true }
    GeocodingResult:
      type: object
      additionalProperties: false
      required: [displayName, latitude, longitude, attribution]
      properties:
        displayName: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the country, when the provider reports it. Pass it on when creating a system so its timezone can be derived.
        attribution: { type: string }
    FreeFormObject:
      type: object
      additionalProperties: true
    OperationalHealth:
      type: object
      additionalProperties: false
      required: [status, detail]
      properties:
        status: { type: string, enum: [ok] }
        detail: { type: string }
        value: { type: integer, format: int64, minimum: 0 }
    CatalogProvenance:
      type: object
      additionalProperties: false
      required: [sourceName, sourceReference]
      properties:
        sourceName: { type: string }
        sourceReference: { type: string, format: uri }
        retrievedOn: { type: [string, "null"], format: date }
    EquipmentValueProvenance:
      type: string
      enum: [manual, catalog_copied, catalog_customized]
    EquipmentTemplateReference:
      type: object
      additionalProperties: false
      required: [entryId, revision, valueProvenance]
      properties:
        entryId:
          { type: string, description: Stable opaque catalog identifier. }
        revision:
          {
            type: string,
            description: Revision explicitly copied into this editable snapshot.,
          }
        valueProvenance:
          { $ref: "#/components/schemas/EquipmentValueProvenance" }
    InverterDcSpecification:
      type: object
      description: DC voltages are millivolts and currents are milliamperes. Per-MPPT limits preserve asymmetric trackers.
      additionalProperties: true
      required: [totalStringInputCount, mpptInputs]
      properties:
        topology: { type: [string, "null"] }
        totalStringInputCount: { type: integer, minimum: 1 }
        maximumInputVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
        startVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
        nominalInputVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
        minimumMpptVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
        maximumMpptVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
        maximumInputCurrentMilliamperes: { type: [integer, "null"], minimum: 1 }
        maximumShortCircuitCurrentMilliamperes:
          { type: [integer, "null"], minimum: 1 }
        mpptInputs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [trackerIndex, stringInputCount]
            properties:
              trackerIndex: { type: integer, minimum: 1 }
              stringInputCount: { type: integer, minimum: 1 }
              maximumOperatingCurrentMilliamperes:
                { type: [integer, "null"], minimum: 1 }
              maximumShortCircuitCurrentMilliamperes:
                { type: [integer, "null"], minimum: 1 }
              minimumVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
              maximumVoltageMillivolts: { type: [integer, "null"], minimum: 1 }
    InverterAcSpecification:
      type: object
      description: AC power uses watts or volt-amperes, voltage millivolts, current milliamperes, frequency millihertz and ratios basis points.
      additionalProperties: true
      required: [phaseCount, ratedActivePowerWatts]
      properties:
        phaseCount: { type: integer, minimum: 1, maximum: 3 }
        ratedActivePowerWatts: { type: integer, minimum: 1 }
        maximumActivePowerWatts: { type: [integer, "null"], minimum: 1 }
        maximumApparentPowerVoltAmperes: { type: [integer, "null"], minimum: 1 }
        maximumOutputCurrentMilliamperes:
          { type: [integer, "null"], minimum: 1 }
        maximumEfficiencyBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
    InverterOperationalSpecification:
      type: object
      description: Temperatures use milli-degrees Celsius, dimensions millimetres, weight grams and acoustic noise millidecibels.
      additionalProperties: true
    InverterSpecificationSnapshot:
      type: object
      additionalProperties: false
      required: [manufacturer, model, dc, ac, operational]
      properties:
        manufacturer: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        dc: { $ref: "#/components/schemas/InverterDcSpecification" }
        ac: { $ref: "#/components/schemas/InverterAcSpecification" }
        operational:
          { $ref: "#/components/schemas/InverterOperationalSpecification" }
        template:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/EquipmentTemplateReference" },
                { type: "null" },
              ],
          }
    InverterCatalogEntry:
      allOf:
        - { $ref: "#/components/schemas/InverterSpecificationSnapshot" }
        - type: object
          required: [id, revision, provenance]
          properties:
            id: { type: string }
            revision: { type: string }
            provenance: { $ref: "#/components/schemas/CatalogProvenance" }
    SolarModuleSpecification:
      type: object
      description: Electrical values use watts, millivolts and milliamperes; efficiencies/bifaciality use basis points; signed temperature coefficients use ppm per degree Celsius; loads use pascals, dimensions millimetres and weight grams.
      additionalProperties: true
      required:
        [
          peakPowerWatts,
          openCircuitVoltageMillivolts,
          maximumPowerVoltageMillivolts,
          shortCircuitCurrentMilliamperes,
          maximumPowerCurrentMilliamperes,
          efficiencyBasisPoints,
        ]
      properties:
        peakPowerWatts: { type: integer, minimum: 1 }
        openCircuitVoltageMillivolts: { type: integer, minimum: 1 }
        maximumPowerVoltageMillivolts: { type: integer, minimum: 1 }
        shortCircuitCurrentMilliamperes: { type: integer, minimum: 1 }
        maximumPowerCurrentMilliamperes: { type: integer, minimum: 1 }
        efficiencyBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
        shortCircuitCurrentTemperatureCoefficientPpmPerCelsius:
          { type: integer }
        openCircuitVoltageTemperatureCoefficientPpmPerCelsius: { type: integer }
        peakPowerTemperatureCoefficientPpmPerCelsius: { type: integer }
        bifacial: { type: boolean }
        bifacialityFactorBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        bifacialityToleranceBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
    SolarModuleSpecificationSnapshot:
      type: object
      additionalProperties: false
      required: [manufacturer, model, specification]
      properties:
        manufacturer: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        specification: { $ref: "#/components/schemas/SolarModuleSpecification" }
        template:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/EquipmentTemplateReference" },
                { type: "null" },
              ],
          }
    SolarModuleCatalogEntry:
      allOf:
        - { $ref: "#/components/schemas/SolarModuleSpecificationSnapshot" }
        - type: object
          required: [id, revision, provenance]
          properties:
            id: { type: string }
            revision: { type: string }
            provenance: { $ref: "#/components/schemas/CatalogProvenance" }
    InverterCatalogPage:
      type: object
      additionalProperties: false
      required: [revision, total, offset, limit, items]
      properties:
        revision: { type: string }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/InverterCatalogEntry" },
          }
    SolarModuleCatalogPage:
      type: object
      additionalProperties: false
      required: [revision, total, offset, limit, items]
      properties:
        revision: { type: string }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/SolarModuleCatalogEntry" },
          }
    PvStringInput:
      type: object
      additionalProperties: false
      required: [name, panelCount, modulePeakPowerWatts, effectiveFrom]
      properties:
        id:
          anyOf: [{ $ref: "#/components/schemas/UuidV7" }, { type: "null" }]
          description: Identifier of an existing string of this inverter to keep. Omit it for a new string. A string that is left out of an update is removed; one that is resubmitted keeps its identifier and the measurement channels bound to it.
        name: { type: string, minLength: 1 }
        panelCount: { type: integer, minimum: 1 }
        panelManufacturer: { type: [string, "null"] }
        panelModel: { type: [string, "null"] }
        valueProvenance:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/EquipmentValueProvenance" },
                { type: "null" },
              ],
          }
        moduleSpecificationSnapshot:
          {
            anyOf:
              [
                {
                  $ref: "#/components/schemas/SolarModuleSpecificationSnapshot",
                },
                { type: "null" },
              ],
          }
        modulePeakPowerWatts:
          type: integer
          format: int64
          minimum: 1
          description: Rated power of one connected panel. The server derives all aggregate power values from this and panelCount.
        orientationDegrees:
          { type: [integer, "null"], minimum: 0, maximum: 359 }
        tiltDegrees: { type: [integer, "null"], minimum: 0, maximum: 90 }
        temperatureCoefficientPpmPerCelsius:
          type: [integer, "null"]
          minimum: -20000
          maximum: 0
          description: Power temperature coefficient of the modules in parts per million per degree Celsius; -3500 is -0.35 %/°C.
        shading:
          type: array
          maxItems: 24
          default: []
          items: { $ref: "#/components/schemas/StringShading" }
        effectiveFrom: { type: integer, format: int64 }
        effectiveTo: { type: [integer, "null"], format: int64 }
    StringShading:
      type: object
      additionalProperties: false
      description: Recurring daily shading of a PV string between two local times of day.
      required: [fromMinuteOfDay, toMinuteOfDay, lossBasisPoints]
      properties:
        fromMinuteOfDay:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes after local midnight at which the shading starts.
        toMinuteOfDay:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes after local midnight at which the shading ends; later than fromMinuteOfDay.
        label: { type: string, default: "" }
        lossBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: Share of the string's output lost while shaded; 10000 is all of it.
    InverterInput:
      type: object
      additionalProperties: false
      required: [name, effectiveFrom, strings]
      properties:
        name: { type: string, minLength: 1 }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
        serialReference: { type: [string, "null"] }
        ratedPowerWatts: { type: [integer, "null"], format: int64, minimum: 1 }
        valueProvenance:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/EquipmentValueProvenance" },
                { type: "null" },
              ],
          }
        specificationSnapshot:
          {
            anyOf:
              [
                { $ref: "#/components/schemas/InverterSpecificationSnapshot" },
                { type: "null" },
              ],
          }
        effectiveFrom: { type: integer, format: int64 }
        effectiveTo: { type: [integer, "null"], format: int64 }
        strings:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PvStringInput" }
    PvString:
      allOf:
        - { $ref: "#/components/schemas/PvStringInput" }
        - type: object
          required: [id, inverterId]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            inverterId: { $ref: "#/components/schemas/UuidV7" }
            moduleCatalogEntryId: { type: [string, "null"], readOnly: true }
            moduleCatalogRevision: { type: [string, "null"], readOnly: true }
            ratedPowerWatts:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
            totalPeakPowerWatts:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
    Inverter:
      allOf:
        - { $ref: "#/components/schemas/InverterInput" }
        - type: object
          required: [id, systemId, version, strings]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            systemId: { $ref: "#/components/schemas/UuidV7" }
            version: { type: integer, minimum: 1 }
            catalogEntryId: { type: [string, "null"], readOnly: true }
            catalogRevision: { type: [string, "null"], readOnly: true }
            firmwareVersion:
              type: string
              readOnly: true
              description: Firmware the device last reported through a data source. Absent until a source reports it.
            firmwareChangedAt:
              type: integer
              format: int64
              readOnly: true
              description: Epoch milliseconds at which a firmware version different from the previous one was first reported.
            strings:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/PvString" }

    CreateInvitation:
      type: object
      additionalProperties: false
      required: [email]
      properties: { email: { type: string, format: email } }
    InvitationCreated:
      type: object
      additionalProperties: false
      required: [invitationId, activationToken, expiresAt]
      properties:
        invitationId: { $ref: "#/components/schemas/UuidV7" }
        activationToken: { type: string, writeOnly: true }
        expiresAt: { type: integer, format: int64 }
    ConnectorAdmin:
      type: object
      additionalProperties: false
      required:
        [id, displayName, protocol, enabled, authorizationEndpoint, scopes]
      properties:
        id: { type: string }
        displayName: { type: string }
        protocol: { enum: [oidc, oauth2] }
        enabled: { type: boolean }
        authorizationEndpoint: { type: [string, "null"], format: uri }
        scopes: { type: array, items: { type: string } }
    AcceptInvitation:
      type: object
      additionalProperties: false
      required: [token, displayName, password]
      properties:
        token: { type: string, writeOnly: true, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        password:
          {
            type: string,
            format: password,
            writeOnly: true,
            minLength: 12,
            maxLength: 128,
          }
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { const: accepted } }
    LocalLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    SessionBootstrap:
      type: object
      additionalProperties: false
      required:
        [authenticated, user, accountId, systemIds, permissions, connectors]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - { $ref: "#/components/schemas/SessionUser" }
            - { type: "null" }
        accountId:
          description: Internal ownership and routing identifier. Clients must not present this as a separate account from the signed-in user.
          oneOf:
            - { $ref: "#/components/schemas/UuidV7" }
            - { type: "null" }
        systemIds:
          { type: array, items: { $ref: "#/components/schemas/UuidV7" } }
        permissions: { type: array, items: { type: string } }
        connectors:
          {
            type: array,
            items: { $ref: "#/components/schemas/SessionConnector" },
          }
    SessionUser:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        displayName: { type: string }
    SessionConnector:
      type: object
      required: [id, name, authorizationUrl]
      properties:
        id: { type: string }
        name: { type: string }
        authorizationUrl: { type: string, format: uri }
    LinkedIdentity:
      type: object
      required:
        [id, connectorId, subject, linkedAtEpochMillis, lastLoginAtEpochMillis]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        connectorId: { $ref: "#/components/schemas/UuidV7" }
        subject: { type: string }
        linkedAtEpochMillis: { type: integer, format: int64 }
        lastLoginAtEpochMillis: { type: [integer, "null"], format: int64 }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1 }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
        parentRoleIds:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/UuidV7" },
          }
    Role:
      allOf:
        - { $ref: "#/components/schemas/RoleInput" }
        - type: object
          required: [id, kind, version, createdAt, updatedAt]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            kind: { type: string }
            version: { type: integer, minimum: 1 }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }
    RoleAssignmentInput:
      type: object
      required: [roleId, principalType, principalId]
      properties:
        roleId: { $ref: "#/components/schemas/UuidV7" }
        principalType: { enum: [user, api_credential] }
        principalId: { $ref: "#/components/schemas/UuidV7" }
        systemId: { $ref: "#/components/schemas/UuidV7" }
        expiresAt: { type: integer, format: int64 }
    RoleAssignment:
      allOf:
        - { $ref: "#/components/schemas/RoleAssignmentInput" }
        - type: object
          required: [id, accountId]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            accountId:
              oneOf:
                - { $ref: "#/components/schemas/UuidV7" }
                - { type: "null" }
    AuditEvent:
      type: object
      required:
        [
          id,
          occurredAt,
          actorType,
          actorId,
          action,
          targetType,
          targetId,
          outcome,
          safeMetadata,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        occurredAt: { type: integer, format: int64 }
        actorType: { type: string }
        actorId: { type: [string, "null"], format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [string, "null"], format: uuid }
        outcome: { type: string }
        safeMetadata: { type: object, additionalProperties: true }
    AlertRuleInput:
      type: object
      required: [name, kind, timezone, enabled]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string, minLength: 1 }
        kind:
          {
            type: string,
            enum:
              [
                idle,
                generation_below,
                consumption_above,
                net_power_above,
                standby_cost_above,
                performance_below,
                battery_below,
                extended_below,
                extended_above,
              ],
          }
        timezone: { type: string, example: Europe/Berlin }
        enabled: { type: boolean }
        condition: { type: object, additionalProperties: true }
    AdministrationUser:
      type: object
      required: [id, email, displayName, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [invited, active, disabled, deleted] }
        emailVerifiedAt: { type: [integer, "null"], format: int64 }
        disabledAt: { type: [integer, "null"], format: int64 }
        lockedUntil: { type: [integer, "null"], format: int64 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    MeasurementChannel:
      type: object
      required:
        [
          id,
          channelKey,
          displayName,
          dataType,
          unit,
          scale,
          aggregation,
          targetKind,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        channelKey: { type: string }
        displayName: { type: string }
        dataType:
          type: string
          enum: [integer, decimal, boolean, counter]
        unit: { type: string }
        scale:
          type: integer
          minimum: 0
          maximum: 9
          description: Decimal places of the stored integer. A lastValue of 1234 at scale 2 is 12.34.
        aggregation: { $ref: "#/components/schemas/ChannelAggregation" }
        targetKind:
          type: string
          enum: [unassigned, plant, inverter, string]
        targetId:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        discoveredAtEpochMillis: { type: [integer, "null"], format: int64 }
        lastValueAtEpochMillis: { type: [integer, "null"], format: int64 }
        lastValue:
          type: [integer, "null"]
          format: int64
          description: Newest value as an integer with scale decimal places.
    ChannelAggregation:
      type: string
      enum: [mean, sum, min, max, last, counter_delta]
      description: How the values of a period are reduced to one value. counter_delta is the growth of a counter, ignoring resets.
    IngestCapabilities:
      type: object
      required: [schemaVersions, contentEncodings, limits]
      properties:
        schemaVersions:
          type: array
          items: { type: integer }
          description: Values of schemaVersion the server accepts.
        contentEncodings:
          type: array
          items: { type: string }
          description: Content encodings a request body may use.
        limits:
          type: object
          required:
            [
              measurements,
              energySamples,
              dailySummaries,
              events,
              devices,
              extraValuesPerDevice,
              bodyBytes,
              decodedBodyBytes,
            ]
          properties:
            measurements:
              { type: integer, description: Most measurements of one request. }
            energySamples: { type: integer }
            dailySummaries: { type: integer }
            events: { type: integer }
            devices:
              type: integer
              description: Most devices one request, and one measurement, may describe.
            extraValuesPerDevice: { type: integer }
            bodyBytes:
              type: integer
              description: Largest body as it is sent, compressed or not.
            decodedBodyBytes:
              type: integer
              description: Largest body after decompression.
    IngestRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion: { type: integer, const: 1 }
        source:
          type: object
          additionalProperties: false
          description: The software that sends the request.
          properties:
            name: { type: string, maxLength: 64, example: smalog }
            version: { type: string, maxLength: 64 }
        devices:
          type: array
          maxItems: 64
          description: Identity of the devices the logger reads. The latest identity is kept per device; an inverter whose serial matches takes the reported firmware and model, and a device that matches no inverter becomes a discovery proposal.
          items: { $ref: "#/components/schemas/IngestDevice" }
        measurements:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/IngestMeasurement" }
        energySamples:
          type: array
          maxItems: 20000
          description: Energy samples from the archive of a device. Where no measurement exists for the time of a sample, the samples of that time supply the system's power and interval energy; a measurement that arrives later replaces what they supplied.
          items:
            type: object
            additionalProperties: false
            required: [deviceId, measuredAt]
            properties:
              deviceId: { $ref: "#/components/schemas/IngestDeviceId" }
              measuredAt: { $ref: "#/components/schemas/EpochSeconds" }
              energyLifetimeWh: { type: integer, format: int64, minimum: 0 }
              powerW: { type: integer, format: int64 }
        dailySummaries:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/IngestDailySummary" }
        events:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/IngestEvent" }
    EpochSeconds:
      type: integer
      format: int64
      minimum: 0
      maximum: 4102444800
      description: Seconds since 1970-01-01T00:00:00Z.
    IngestDeviceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      description: The device as the logger names it; for an inverter its serial number.
    IngestDevice:
      type: object
      additionalProperties: false
      required: [id]
      description: What a logger reports about one of its devices. An absent member leaves the value reported before untouched.
      properties:
        id: { $ref: "#/components/schemas/IngestDeviceId" }
        kind: { type: string, maxLength: 120, default: inverter }
        familyId:
          oneOf:
            - { type: string, minLength: 1, maxLength: 120 }
            - { type: integer, format: int64 }
          description: Device family identifier, such as SMA's SUSy ID. It may be sent as the number a logger stores.
        configuredName:
          type: string
          maxLength: 120
          description: Name the operator gave the device in the logger.
        reportedName:
          type: string
          maxLength: 120
          description: Name the device reports for itself.
        model: { type: string, maxLength: 120 }
        firmware: { type: string, maxLength: 120 }
        transport:
          type: string
          maxLength: 120
          description: How the logger reaches the device, for example bluetooth or ethernet.
    IngestMeasurement:
      type: object
      additionalProperties: false
      required: [measuredAt]
      description: What was measured at one time. It needs values of the system, of devices, or both.
      properties:
        measuredAt: { $ref: "#/components/schemas/EpochSeconds" }
        system:
          type: object
          additionalProperties: false
          description: Values of the whole system. A value stated here wins over the one derived from the devices of the same measurement.
          properties:
            generationPowerW: { type: integer, format: int64 }
            generationEnergyWh: { type: integer, format: int64 }
            generationLifetimeWh: { type: integer, format: int64, minimum: 0 }
            consumptionPowerW: { type: integer, format: int64 }
            consumptionEnergyWh: { type: integer, format: int64 }
            consumptionLifetimeWh: { type: integer, format: int64, minimum: 0 }
            gridImportPowerW: { type: integer, format: int64, minimum: 0 }
            gridExportPowerW:
              type: integer
              format: int64
              minimum: 0
              description: Import and export power must not both be above zero.
            gridImportEnergyWh: { type: integer, format: int64, minimum: 0 }
            gridExportEnergyWh: { type: integer, format: int64, minimum: 0 }
            batteryStateOfChargePermille:
              { type: integer, minimum: 0, maximum: 1000 }
            batteryPowerW:
              type: integer
              format: int64
              description: Positive while the battery charges.
            batteryEnergyWh: { type: integer, format: int64, minimum: 0 }
            temperatureMillicelsius: { type: integer, format: int32 }
            voltageMv: { type: integer, format: int32, minimum: 0 }
            message: { type: string, maxLength: 30 }
        devices:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/IngestDeviceValues" }
    IngestDeviceValues:
      type: object
      additionalProperties: false
      required: [id]
      description: Values of one device at one time. Each becomes a measurement channel of the device under the key scheme of the source profiles.
      properties:
        id: { $ref: "#/components/schemas/IngestDeviceId" }
        ac:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [phase]
            properties:
              phase: { type: integer, minimum: 1, maximum: 3 }
              powerW: { type: integer, format: int64 }
              currentMa: { type: integer, format: int64 }
              voltageMv: { type: integer, format: int64 }
        gridFrequencyMhz: { type: integer, format: int64, minimum: 0 }
        gridImportPowerW: { type: integer, format: int64, minimum: 0 }
        gridExportPowerW: { type: integer, format: int64, minimum: 0 }
        energyTodayWh: { type: integer, format: int64, minimum: 0 }
        energyLifetimeWh: { type: integer, format: int64, minimum: 0 }
        operatingTimeS: { type: integer, format: int64, minimum: 0 }
        feedInTimeS: { type: integer, format: int64, minimum: 0 }
        statusCode:
          type: integer
          format: int64
          description: Numeric status as the device reports it. It is labelled from the source profile when shown.
        gridRelayStatusCode: { type: integer, format: int64 }
        temperatureMillicelsius: { type: integer, format: int64 }
        signalPermille: { type: integer, minimum: 0, maximum: 1000 }
        trackers:
          type: array
          description: DC inputs by the number the device gives them. Numbers may have gaps and are not renumbered.
          items:
            type: object
            additionalProperties: false
            required: [number]
            properties:
              number: { type: integer, minimum: 1, maximum: 255 }
              powerW: { type: integer, format: int64 }
              currentMa: { type: integer, format: int64 }
              voltageMv: { type: integer, format: int64 }
        battery:
          type: object
          additionalProperties: false
          properties:
            stateOfChargePermille: { type: integer, minimum: 0, maximum: 1000 }
            voltageMv: { type: integer, format: int64 }
            currentMa: { type: integer, format: int64 }
            temperatureMillicelsius: { type: integer, format: int64 }
        extra:
          type: object
          maxProperties: 32
          description: "Values PVLog has no member for, by a name the logger chooses from lower-case letters, digits, dot, hyphen and underscore. Each becomes the measurement channel inv.<serial>.x.<name> with the unit it states. A value that contradicts the channel's unit is left out and named in rejected."
          additionalProperties:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              value:
                type: number
                description: Plain decimal notation with at most nine decimal places; stored without rounding.
              unit: { type: string, minLength: 1, maxLength: 16 }
    IngestDailySummary:
      type: object
      additionalProperties: false
      required: [date]
      description: The summary of one local day. Summaries of devices are added up to the day's value; see the daily summary resource for which value a day reports.
      properties:
        deviceId:
          allOf: [{ $ref: "#/components/schemas/IngestDeviceId" }]
          description: Absent for a summary of the whole system.
        date: { type: string, format: date }
        energyWh: { type: integer, format: int64, minimum: 0 }
        energyLifetimeWh:
          type: integer
          format: int64
          minimum: 0
          description: Lifetime counter at the end of the day.
        complete:
          type: boolean
          default: false
          description: True once the day will not change any more.
        exportEnergyWh: { type: integer, format: int64, minimum: 0 }
        consumptionEnergyWh: { type: integer, format: int64, minimum: 0 }
        peakPowerW: { type: integer, format: int64, minimum: 0 }
        peakTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        weatherCondition: { type: string, maxLength: 40 }
        temperatureMinMillicelsius: { type: integer, format: int64 }
        temperatureMaxMillicelsius: { type: integer, format: int64 }
        importEnergyWhByBand:
          type: object
          additionalProperties: false
          properties:
            peak: { type: integer, format: int64, minimum: 0 }
            offPeak: { type: integer, format: int64, minimum: 0 }
            shoulder: { type: integer, format: int64, minimum: 0 }
            highShoulder: { type: integer, format: int64, minimum: 0 }
    IngestEvent:
      type: object
      additionalProperties: false
      required: [deviceId, occurredAt]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 64 }
        eventId:
          oneOf:
            - { type: string, minLength: 1, maxLength: 128 }
            - { type: integer, format: int64 }
          description: The device's own identifier of the event. Without it the event is identified by its time and code.
        occurredAt: { $ref: "#/components/schemas/EpochSeconds" }
        code: { type: integer, format: int64 }
        type: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 500 }
        group: { type: string, maxLength: 500 }
        message: { type: string, maxLength: 500 }
        oldValue: { type: string, maxLength: 500 }
        newValue: { type: string, maxLength: 500 }
        userGroup: { type: string, maxLength: 500 }
    IngestRejection:
      type: object
      required: [category, index, member, reason]
      properties:
        category:
          type: string
          enum:
            [
              source,
              devices,
              measurements,
              energySamples,
              dailySummaries,
              events,
            ]
          description: The list the item is in.
        index:
          type: integer
          minimum: 0
          description: Position of the item in that list, counted from zero.
        member:
          type: string
          description: Path of the member within the item, or the channel key of a value that was left out. Empty when the item as a whole is meant.
        reason:
          type: string
          description: Stable code of what is wrong, for example out_of_range, negative, duplicate, empty or unit_mismatch.
    IngestCounts:
      type: object
      required: [stored, unchanged, rejected]
      properties:
        stored:
          type: integer
          description: Items that were new, or replaced a stored item with other values.
        unchanged:
          type: integer
          description: Items that were already stored as sent.
        rejected:
          type: array
          description: Values that were left out while the rest of their item was stored.
          items: { $ref: "#/components/schemas/IngestRejection" }
    IngestMark:
      type: object
      description: How far a source has delivered for one device or for the system. An absent member means that nothing of that kind is held.
      properties:
        deviceId:
          type: string
          description: Absent in the marks of the system.
        measuredAt: { $ref: "#/components/schemas/EpochSeconds" }
        sampleAt: { $ref: "#/components/schemas/EpochSeconds" }
        summaryDate: { type: string, format: date }
        eventAt: { $ref: "#/components/schemas/EpochSeconds" }
    IngestMarks:
      type: object
      required: [system, devices]
      properties:
        system: { $ref: "#/components/schemas/IngestMark" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/IngestMark" }
    IngestResponse:
      type: object
      required: [measurements, energySamples, dailySummaries, events, marks]
      properties:
        measurements: { $ref: "#/components/schemas/IngestCounts" }
        energySamples: { $ref: "#/components/schemas/IngestCounts" }
        dailySummaries: { $ref: "#/components/schemas/IngestCounts" }
        events: { $ref: "#/components/schemas/IngestCounts" }
        marks: { $ref: "#/components/schemas/IngestMarks" }
    IngestProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            title:
              type: string
              enum:
                [
                  malformed_request,
                  unknown_member,
                  unsupported_schema_version,
                  unsupported_content_encoding,
                  limit_exceeded,
                  items_rejected,
                  service_unavailable,
                ]
            detail:
              type: string
              description: The path of an unknown member, the limit that was exceeded, or what the parser reported.
            limit:
              type: integer
              description: The limit that was exceeded.
            schemaVersions:
              type: array
              items: { type: integer }
            contentEncodings:
              type: array
              items: { type: string }
            rejected:
              type: array
              description: Every item that cannot be stored.
              items: { $ref: "#/components/schemas/IngestRejection" }
    DeviceEventInput:
      type: object
      required: [deviceId, occurredAtEpochMillis]
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          description: The device as the source names it. For an inverter this is its serial number.
        eventId:
          type: [string, "null"]
          maxLength: 128
          description: The source's own identifier of the event within the device. Without it, the event is identified by its time and code. An event uploaded again with the same device and identifier is stored once; when any of its members differs, it replaces the stored event.
        occurredAtEpochMillis: { type: integer, format: int64, minimum: 0 }
        code: { type: [integer, "null"], format: int64 }
        message: { type: [string, "null"], maxLength: 500 }
        type:
          type: string
          maxLength: 500
          description: Kind of event as the device names it.
        category:
          type: string
          maxLength: 500
          description: Severity category, such as an error or a warning.
        group:
          type: string
          maxLength: 500
          description: Group the device files the event under.
        oldValue:
          type: string
          maxLength: 500
          description: Value a changed setting had before the event.
        newValue:
          type: string
          maxLength: 500
          description: Value a changed setting has since the event.
        userGroup:
          type: string
          maxLength: 500
          description: User group that caused the event, such as an installer.
    DeviceEvent:
      type: object
      required: [id, deviceId, occurredAtEpochMillis, receivedAtEpochMillis]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        deviceId: { type: string }
        eventId: { type: [string, "null"] }
        occurredAtEpochMillis: { type: integer, format: int64 }
        code: { type: [integer, "null"], format: int64 }
        message: { type: [string, "null"] }
        type:
          {
            type: string,
            description: Absent when the device did not report it.,
          }
        category: { type: string }
        group: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        userGroup: { type: string }
        dataSourceId:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
          description: Data source the event was delivered through, when it is known.
        receivedAtEpochMillis: { type: integer, format: int64 }
    EnergySample:
      type: object
      required:
        [
          deviceId,
          measuredAtEpochMillis,
          energyLifetimeWh,
          powerWatts,
          dataSourceId,
          receivedAtEpochMillis,
        ]
      properties:
        deviceId:
          type: string
          description: The device as the source names it; for an inverter its serial.
        measuredAtEpochMillis: { type: integer, format: int64 }
        energyLifetimeWh:
          type: [integer, "null"]
          format: int64
          description: The device's lifetime energy counter, null when the sample has none.
        powerWatts:
          type: [integer, "null"]
          format: int64
          description: Mean power of the sample interval, null when the sample has none.
        dataSourceId:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
          description: Data source the sample was delivered through, when it is known.
        receivedAtEpochMillis: { type: integer, format: int64 }
    DiscoveryProposal:
      type: object
      required:
        [
          id,
          deviceSerial,
          state,
          trackers,
          channelCount,
          firstSeenAtEpochMillis,
          lastSeenAtEpochMillis,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        deviceSerial: { type: string }
        reportedName: { type: [string, "null"] }
        model: { type: [string, "null"] }
        firmware: { type: [string, "null"] }
        state: { type: string, enum: [open, dismissed] }
        trackers:
          type: array
          description: Tracker numbers of the DC inputs that have reported power. Numbers are kept as the device reports them and may have gaps.
          items: { type: integer, minimum: 1, maximum: 255 }
        channelCount:
          type: integer
          description: Measurement channels the device delivers.
        firstSeenAtEpochMillis: { type: integer, format: int64 }
        lastSeenAtEpochMillis: { type: integer, format: int64 }
    DiscoveryAdoption:
      type: object
      required: [strings]
      properties:
        name:
          type: [string, "null"]
          maxLength: 120
          description: Name of the inverter. The reported name, or else the serial, when absent.
        strings:
          type: array
          minItems: 1
          maxItems: 255
          items:
            type: object
            required: [capacityWatts]
            properties:
              tracker:
                type: [integer, "null"]
                minimum: 1
                maximum: 255
                description: Tracker whose channels the string receives. It must be a tracker the device has a channel for, and may be named once. A string without a tracker receives no channels.
              name: { type: [string, "null"], maxLength: 120 }
              capacityWatts:
                type: integer
                minimum: 1
                description: Installed capacity of the string in watts peak. Module details can be added later.
              orientationDegrees:
                { type: [integer, "null"], minimum: 0, maximum: 359 }
              tiltDegrees: { type: [integer, "null"], minimum: 0, maximum: 90 }
    AdoptedEquipment:
      type: object
      required: [inverterId, strings, boundChannels]
      properties:
        inverterId: { $ref: "#/components/schemas/UuidV7" }
        strings:
          type: array
          items:
            type: object
            required: [stringId, name]
            properties:
              stringId: { $ref: "#/components/schemas/UuidV7" }
              tracker: { type: [integer, "null"] }
              name: { type: string }
        boundChannels:
          type: integer
          description: Measurement channels that were bound to the new equipment.
    ChannelAggregate:
      type: object
      required: [channelKey, displayName, unit, scale, aggregation, buckets]
      properties:
        channelKey: { type: string }
        displayName: { type: string }
        unit: { type: string }
        scale:
          type: integer
          description: Decimal places of every value in buckets.
        aggregation: { $ref: "#/components/schemas/ChannelAggregation" }
        buckets:
          type: array
          items:
            type: object
            required:
              [startEpochMillis, endEpochMillis, minimum, maximum, pointCount]
            properties:
              startEpochMillis: { type: integer, format: int64 }
              endEpochMillis: { type: integer, format: int64 }
              value:
                type: [integer, "null"]
                format: int64
                description: The bucket reduced by the channel's aggregation kind. A mean is rounded to the nearest stored integer. Null for a counter whose first value in the bucket has no predecessor.
              minimum: { type: integer, format: int64 }
              maximum: { type: integer, format: int64 }
              pointCount: { type: integer, format: int64 }
    RejectedChannel:
      type: object
      description: A channel value that was not stored because it contradicts the definition of its channel.
      required: [channelKey, reason]
      properties:
        channelKey: { type: string }
        reason:
          type: string
          enum:
            [value_missing, unit_mismatch, type_mismatch, value_out_of_range]
          description: unit_mismatch when the unit differs from the channel's unit, type_mismatch when the value has more decimal places than the channel keeps.
    MeasurementChannelBinding:
      type: object
      required: [targetKind]
      properties:
        targetKind:
          type: string
          enum: [unassigned, plant, inverter, string]
        targetId:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        displayName: { type: [string, "null"] }
        aggregation:
          oneOf:
            - $ref: "#/components/schemas/ChannelAggregation"
            - type: "null"
          description: Kept as stored when absent.
    RangeSummary:
      type: object
      required:
        [range, startEpochMillis, endEpochMillis, generationEnergyWh, revenue]
      properties:
        range: { type: string, enum: [live, day, week, month, year] }
        startEpochMillis: { type: integer, format: int64 }
        endEpochMillis: { type: integer, format: int64 }
        generationEnergyWh: { type: integer, format: int64 }
        consumptionEnergyWh: { type: [integer, "null"], format: int64 }
        peakPowerWatts: { type: [integer, "null"], format: int64 }
        currentPowerWatts: { type: [integer, "null"], format: int64 }
        averageBucketEnergyWh: { type: [integer, "null"], format: int64 }
        bestBucket:
          type: [object, "null"]
          required: [startEpochMillis, energyWh]
          properties:
            startEpochMillis: { type: integer, format: int64 }
            energyWh: { type: integer, format: int64 }
        previousPeriod:
          type: [object, "null"]
          required: [generationEnergyWh, changeBasisPoints]
          properties:
            generationEnergyWh: { type: integer, format: int64 }
            changeBasisPoints: { type: integer, format: int64 }
        revenue:
          type: object
          required: [minorUnits, periodsApplied, unpricedEnergyWh]
          properties:
            minorUnits: { type: integer, format: int64 }
            currencyCode: { type: [string, "null"] }
            periodsApplied: { type: integer, minimum: 0 }
            unpricedEnergyWh: { type: integer, format: int64 }
        capacityWatts: { type: [integer, "null"], format: int64 }
    StringContribution:
      type: object
      required:
        [
          stringId,
          name,
          inverterId,
          inverterName,
          ratedPowerWatts,
          generationEnergyWh,
          status,
          metered,
        ]
      properties:
        stringId: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string }
        inverterId: { $ref: "#/components/schemas/UuidV7" }
        inverterName: { type: string }
        ratedPowerWatts: { type: integer, format: int64 }
        generationEnergyWh: { type: integer, format: int64 }
        status: { type: string, enum: [online, idle, fault, offline] }
        metered: { type: boolean }
    WeatherMonth:
      type: object
      required: [monthStartEpochMillis, generationEnergyWh, classes]
      properties:
        monthStartEpochMillis: { type: integer, format: int64 }
        generationEnergyWh: { type: integer, format: int64 }
        classes:
          type: array
          items:
            type: object
            required: [class, shareBasisPoints, generationEnergyWh]
            properties:
              class:
                type: string
                enum: [clear, partly_cloudy, mostly_cloudy, overcast]
              shareBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
              generationEnergyWh: { type: integer, format: int64 }
    SharingState:
      type: object
      required: [systemId, linkEnabled, visibility]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        linkEnabled: { type: boolean }
        publicToken: { type: [string, "null"] }
        visibility: { type: string, enum: [private, unlisted, public] }
    SharingInput:
      type: object
      required: [linkEnabled]
      properties:
        linkEnabled: { type: boolean }
        rotateToken: { type: boolean, default: false }
        visibility:
          type: [string, "null"]
          enum: [private, unlisted, public, null]
    PublicSystem:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string }
        location: { type: [string, "null"] }
        commissioningDate: { type: [string, "null"] }
        capacityWatts: { type: [integer, "null"], format: int64 }
        timezone: { type: string }
        generationTodayWh: { type: [integer, "null"], format: int64 }
        generationTotalWh: { type: [integer, "null"], format: int64 }
        lastSeenEpochMillis: { type: [integer, "null"], format: int64 }
    PublicDirectoryEntry:
      type: object
      required: [name, publicToken]
      properties:
        name: { type: string }
        location: { type: [string, "null"] }
        capacityWatts: { type: [integer, "null"], format: int64 }
        publicToken: { type: string }
    AdministrationAccount:
      type: object
      required:
        [
          id,
          slug,
          displayName,
          status,
          memberCount,
          systemCount,
          createdAtEpochMillis,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        slug: { type: string }
        displayName: { type: string }
        status:
          type: string
          enum:
            [provisioning, active, suspended, quarantined, deleting, deleted]
        memberCount: { type: integer, format: int64, minimum: 0 }
        systemCount: { type: integer, format: int64, minimum: 0 }
        createdAtEpochMillis: { type: integer, format: int64 }
    WeatherFeedSettings:
      type: object
      required: [enabled, endpoint]
      properties:
        enabled: { type: boolean }
        endpoint: { type: string, example: "mqtt://broker.local:1883/weather" }
        credentialSecretRef: { type: [string, "null"] }
        updatedAtEpochMillis:
          { type: [integer, "null"], format: int64, readOnly: true }
    EmailNotificationSettings:
      type: object
      required: [enabled, recipient, host, port, username, encryption]
      properties:
        enabled: { type: boolean }
        recipient: { type: string, format: email }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        credentialSecretRef: { type: [string, "null"] }
        encryption: { type: string, enum: [none, starttls, tls] }
        updatedAtEpochMillis:
          { type: [integer, "null"], format: int64, readOnly: true }
    RetentionBackupSettings:
      type: object
      required: [readingRetentionDays, automaticBackupsEnabled, backupSchedule]
      properties:
        readingRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        automaticBackupsEnabled: { type: boolean }
        backupSchedule: { type: string, example: "0 2 * * *" }
        lastBackupAtEpochMillis:
          { type: [integer, "null"], format: int64, readOnly: true }
        lastBackupBytes:
          { type: [integer, "null"], format: int64, readOnly: true }
        updatedAtEpochMillis:
          { type: [integer, "null"], format: int64, readOnly: true }
    ConnectionTestResult:
      type: object
      required: [reachable]
      properties: { reachable: { type: boolean } }
    BackupResult:
      type: object
      required: [completedAtEpochMillis, byteLength, artifactName]
      properties:
        completedAtEpochMillis: { type: integer, format: int64 }
        byteLength: { type: integer, format: int64, minimum: 0 }
        artifactName: { type: string }
    AlertRule:
      allOf:
        - { $ref: "#/components/schemas/AlertRuleInput" }
        - {
            type: object,
            required: [id],
            properties: { id: { $ref: "#/components/schemas/UuidV7" } },
          }
    AlertEvent:
      type: object
      required: [id, ruleId, state, openedAtEpochMillis]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        ruleId: { $ref: "#/components/schemas/UuidV7" }
        state: { type: string, enum: [open, acknowledged, resolved] }
        openedAtEpochMillis: { type: integer, format: int64 }
        resolvedAtEpochMillis: { type: [integer, "null"], format: int64 }
    WebhookInput:
      type: object
      required: [endpoint, events]
      properties:
        endpoint: { type: string, format: uri, pattern: "^https://" }
        events:
          {
            type: array,
            uniqueItems: true,
            items:
              {
                type: string,
                enum:
                  [
                    observation_accepted,
                    alert_opened,
                    alert_resolved,
                    system_changed,
                    export_ready,
                  ],
              },
          }
    WebhookSubscription:
      allOf:
        - { $ref: "#/components/schemas/WebhookInput" }
        - {
            type: object,
            required: [id, state],
            properties:
              {
                id: { $ref: "#/components/schemas/UuidV7" },
                state:
                  {
                    type: string,
                    enum: [pending_verification, active, disabled],
                  },
                challenge: { type: string, writeOnly: true },
              },
          }
    WebhookEvent:
      type: object
      required:
        [schema_version, event_id, event_type, occurred_at_epoch_millis, data]
      properties:
        schema_version: { type: integer, const: 1 }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        occurred_at_epoch_millis: { type: integer, format: int64 }
        data: { type: object, additionalProperties: true }
    WebhookAttempt:
      type: object
      required: [attemptedAtEpochMillis]
      properties:
        attemptedAtEpochMillis: { type: integer, format: int64 }
        responseStatus: { type: [integer, "null"], minimum: 100, maximum: 599 }
        errorClass: { type: [string, "null"] }
        durationMilliseconds: { type: integer, minimum: 0 }
    SystemDetails:
      type: object
      description: Optional system fields that can be supplied at creation and changed later.
      properties:
        description: { type: string, default: "" }
        commissioningDate:
          type: [string, "null"]
          format: date
          description: Local commissioning date.
        locationLabel:
          type: [string, "null"]
          description: Label of the place the owner picked, shown next to the coordinates.
        countryCode:
          type: [string, "null"]
          pattern: "^[A-Za-z]{2}$"
          description: ISO 3166-1 alpha-2 code of the country the location lies in, as the location search returns it.
        latitudeMicrodegrees:
          type: [integer, "null"]
          minimum: -90000000
          maximum: 90000000
          description: Supplied together with longitudeMicrodegrees or not at all.
        longitudeMicrodegrees:
          type: [integer, "null"]
          minimum: -180000000
          maximum: 180000000
        statusIntervalSeconds:
          type: [integer, "null"]
          minimum: 30
          maximum: 86400
          description: Expected seconds between readings. Omitted on update to keep the current value; a new system defaults to 300.
        declaredCapacityWatts:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Capacity the owner states. Used until the system has strings, which then define the capacity.
    CreateSystem:
      allOf:
        - $ref: "#/components/schemas/SystemDetails"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            timezone:
              type: [string, "null"]
              example: Europe/Berlin
              description: IANA timezone the owner chose. When omitted the timezone is taken from the country of the location, and otherwise from clientTimezone.
            clientTimezone:
              type: [string, "null"]
              description: IANA timezone of the client, used when neither timezone nor the location's country decides it.
            inverters:
              type: array
              description: Inverters with their strings to create together with the system. All of them are validated before anything is stored, so the request creates everything or nothing.
              items: { $ref: "#/components/schemas/InverterInput" }
    UpdateSystem:
      allOf:
        - $ref: "#/components/schemas/SystemDetails"
        - type: object
          required: [name, timezone, visibility]
          properties:
            name: { type: string, minLength: 1 }
            timezone: { type: string }
            visibility: { enum: [private, account, unlisted, public] }
    System:
      allOf:
        - $ref: "#/components/schemas/UpdateSystem"
        - type: object
          required:
            [
              id,
              accountId,
              lifecycle,
              version,
              statusIntervalSeconds,
              createdAt,
              updatedAt,
            ]
          properties:
            id: { $ref: "#/components/schemas/UuidV7" }
            accountId: { $ref: "#/components/schemas/UuidV7" }
            lifecycle: { enum: [active, archived, pending_deletion] }
            version: { type: integer, minimum: 1 }
            statusIntervalSeconds:
              { type: integer, minimum: 30, maximum: 86400 }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }
            derivedCapacityWatts:
              type: [integer, "null"]
              format: int64
              readOnly: true
              description: Sum of the rated power of the system's strings; null without strings.
            capacityWatts:
              type: [integer, "null"]
              format: int64
              readOnly: true
              description: Capacity to display and validate against. The derived capacity when strings exist, otherwise the declared one.
            capacitySource:
              type: [string, "null"]
              enum: [derived, declared, null]
              readOnly: true
              description: Where capacityWatts comes from. With "derived", a declared capacity is overridden.
    ManagedResource:
      type: object
      required: [id, accountId, kind, version, attributes]
      properties:
        {
          id: { $ref: "#/components/schemas/UuidV7" },
          accountId: { $ref: "#/components/schemas/UuidV7" },
          systemId: { $ref: "#/components/schemas/UuidV7" },
          kind: { enum: [equipment, tariff, channel, membership, credential] },
          version: { type: integer, minimum: 1 },
          attributes: { type: object, additionalProperties: true },
        }
    ObservationInput:
      type: object
      required: [observedAtEpochMillis]
      properties:
        {
          observedAtEpochMillis: { type: integer },
          generationPowerWatts: { type: integer },
          generationEnergyWh: { type: integer },
          consumptionPowerWatts: { type: integer },
          consumptionEnergyWh: { type: integer },
          generationLifetimeWh:
            {
              type: integer,
              minimum: 0,
              description: Lifetime generation counter. When generationEnergyWh is absent it is derived from the difference to the previous counter of the same source. A counter lower than its predecessor is a reset; nothing is derived for that reading and it is flagged. Nothing is derived without a predecessor.,
            },
          consumptionLifetimeWh:
            {
              type: integer,
              minimum: 0,
              description: "Lifetime consumption counter, treated like generationLifetimeWh.",
            },
          gridImportPowerWatts:
            {
              type: integer,
              minimum: 0,
              description: Power drawn from the grid.,
            },
          gridExportPowerWatts:
            {
              type: integer,
              minimum: 0,
              description: Power fed into the grid. A reading whose import and export power are both above zero is rejected.,
            },
          gridImportEnergyWh:
            {
              type: integer,
              minimum: 0,
              description: Energy drawn from the grid during the interval.,
            },
          gridExportEnergyWh:
            {
              type: integer,
              minimum: 0,
              description: Energy fed into the grid during the interval.,
            },
          voltageMillivolts: { type: integer, minimum: 0 },
          temperatureMillidegreesCelsius: { type: integer },
          batteryStateOfChargeBasisPoints:
            {
              type: integer,
              minimum: 0,
              maximum: 10000,
              description: "State of charge of the system's battery; 10000 is full. When absent it is taken from the devices that report inv.<serial>.battery.soc, each counting equally.",
            },
          batteryPowerWatts:
            {
              type: integer,
              description: Power flowing into the battery. Positive while charging and negative while discharging.,
            },
          batteryEnergyWh:
            {
              type: integer,
              minimum: 0,
              description: Energy the battery holds at the time of the reading. Its change over a period is reported with the aggregates.,
            },
          devices:
            {
              type: array,
              maxItems: 64,
              description: "Identity of the devices the source reads. The latest identity is kept per device. An inverter whose serial matches takes the reported firmware and, unless its model comes from the equipment catalog, the reported model. A device that matches no inverter becomes a discovery proposal.",
              items: { $ref: "#/components/schemas/ReportedDevice" },
            },
          message:
            {
              type: string,
              maxLength: 30,
              description: "Short text from the source, such as a status. Returned when the reading is inspected.",
            },
          sourceReference: { type: string },
          channels:
            {
              type: object,
              description: "Values keyed by the source's own channel names. An unknown key is registered as an unassigned measurement channel: a key of the device key scheme with the unit the scheme defines, any other key with the unit of its first value. A value that contradicts its channel is left out and named in rejectedChannels; the rest of the reading is stored.",
              additionalProperties:
                {
                  type: object,
                  properties:
                    {
                      value:
                        {
                          type: number,
                          description: "Value in the channel's unit, in plain decimal notation with at most nine decimal places. It is stored without rounding.",
                        },
                      unit:
                        {
                          type: string,
                          minLength: 1,
                          maxLength: 16,
                          description: "Unit of value. It becomes the unit of a new channel and must equal the unit of an existing one.",
                        },
                      powerWatts:
                        {
                          type: integer,
                          description: Earlier form of a value in watts.,
                        },
                      energyWattHours:
                        {
                          type: integer,
                          description: Earlier form of a value in watt-hours.,
                        },
                      quality: { type: string, enum: [estimated] },
                    },
                },
            },
          test:
            {
              type: boolean,
              default: false,
              description: Marks a reading sent only to prove the connection. It is validated like any other but stored apart from telemetry. Not allowed in a batch.,
            },
        }
    ReportedDevice:
      type: object
      additionalProperties: false
      required: [id]
      description: What a source reports about one of its devices. An absent member leaves the value reported before untouched.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: "The source's identifier of the device; for an inverter its serial number. It is the serial in the keys of the device key scheme."
        kind:
          type: string
          maxLength: 120
          default: inverter
        familyId:
          type: string
          maxLength: 120
          description: Device family identifier, such as SMA's SUSy ID.
        configuredName:
          type: string
          maxLength: 120
          description: Name the operator gave the device in the logger.
        reportedName:
          type: string
          maxLength: 120
          description: Name the device reports for itself.
        model: { type: string, maxLength: 120 }
        firmware: { type: string, maxLength: 120 }
        transport:
          type: string
          maxLength: 120
          description: How the logger reaches the device, for example bluetooth or speedwire.
    ObservationBatchInput:
      type: object
      required: [mode, items]
      properties:
        {
          mode: { enum: [atomic, partial] },
          items:
            {
              type: array,
              minItems: 1,
              maxItems: 1000,
              items:
                {
                  allOf:
                    [
                      { $ref: "#/components/schemas/ObservationInput" },
                      {
                        type: object,
                        required: [idempotencyKey],
                        properties:
                          { idempotencyKey: { type: string, minLength: 1 } },
                      },
                    ],
                },
            },
        }
    ForecastScope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, account_id]
          properties:
            kind: { const: account }
            account_id: { $ref: "#/components/schemas/UuidV7" }
        - type: object
          additionalProperties: false
          required: [kind, account_id, system_id]
          properties:
            kind: { const: system }
            account_id: { $ref: "#/components/schemas/UuidV7" }
            system_id: { $ref: "#/components/schemas/UuidV7" }
        - type: object
          additionalProperties: false
          required: [kind, account_id, system_id, inverter_id]
          properties:
            kind: { const: inverter }
            account_id: { $ref: "#/components/schemas/UuidV7" }
            system_id: { $ref: "#/components/schemas/UuidV7" }
            inverter_id: { $ref: "#/components/schemas/UuidV7" }
        - type: object
          additionalProperties: false
          required: [kind, account_id, system_id, inverter_id, string_id]
          properties:
            kind: { const: string }
            account_id: { $ref: "#/components/schemas/UuidV7" }
            system_id: { $ref: "#/components/schemas/UuidV7" }
            inverter_id: { $ref: "#/components/schemas/UuidV7" }
            string_id: { $ref: "#/components/schemas/UuidV7" }
    ForecastLosses:
      type: object
      additionalProperties: false
      required:
        [
          soilingBasisPoints,
          shadingBasisPoints,
          mismatchBasisPoints,
          wiringBasisPoints,
          unavailabilityBasisPoints,
        ]
      properties:
        soilingBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        shadingBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        mismatchBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        wiringBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        unavailabilityBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
    ForecastSettingsInput:
      type: object
      additionalProperties: false
      required:
        [
          effectiveFrom,
          effectiveTo,
          modelIdentifier,
          modelRevision,
          losses,
          calibrationBasisPoints,
        ]
      properties:
        effectiveFrom: { type: integer, format: int64 }
        effectiveTo: { type: [integer, "null"], format: int64 }
        modelIdentifier: { type: string, minLength: 1, maxLength: 64 }
        modelRevision: { type: integer, minimum: 1, maximum: 65535 }
        losses: { $ref: "#/components/schemas/ForecastLosses" }
        calibrationBasisPoints: { type: integer, minimum: -5000, maximum: 5000 }
    ForecastSettings:
      allOf:
        - { $ref: "#/components/schemas/ForecastSettingsInput" }
        - type: object
          additionalProperties: false
          required: [scope, version]
          properties:
            scope: { $ref: "#/components/schemas/ForecastScope" }
            version: { type: integer, format: int64, minimum: 1 }
    ForecastCompletenessReason:
      enum:
        - missing_system_location
        - missing_module_identity
        - missing_orientation
        - missing_tilt
        - missing_module_capacity
        - missing_module_specification
        - missing_forecast_settings
        - missing_weather_input
        - unsupported_weather_input
        - incompatible_input_run
        - partial_effective_capacity
        - insufficient_weather_coverage
        - insufficient_actual_coverage
        - missing_actual_telemetry
        - non_positive_expected_energy
        - no_effective_equipment
    ForecastCompleteness:
      oneOf:
        - const: complete
        - type: object
          additionalProperties: false
          required: [partial]
          properties:
            partial:
              type: object
              additionalProperties: false
              required: [reasons]
              properties:
                reasons:
                  {
                    type: array,
                    items:
                      {
                        $ref: "#/components/schemas/ForecastCompletenessReason",
                      },
                  }
        - type: object
          additionalProperties: false
          required: [unavailable]
          properties:
            unavailable:
              type: object
              additionalProperties: false
              required: [reasons]
              properties:
                reasons:
                  {
                    type: array,
                    items:
                      {
                        $ref: "#/components/schemas/ForecastCompletenessReason",
                      },
                  }
    ForecastInputCompleteness:
      type: object
      additionalProperties: false
      required:
        [
          scope,
          effectiveAt,
          includedCapacityWatts,
          totalEffectiveCapacityWatts,
          complete,
          reasons,
          version,
        ]
      properties:
        scope: { $ref: "#/components/schemas/ForecastScope" }
        effectiveAt: { type: integer, format: int64 }
        includedCapacityWatts: { type: integer, format: int64, minimum: 0 }
        totalEffectiveCapacityWatts:
          { type: integer, format: int64, minimum: 0 }
        complete: { type: boolean }
        reasons:
          {
            type: array,
            items: { $ref: "#/components/schemas/ForecastCompletenessReason" },
          }
        version: { type: integer, format: int64, minimum: 1 }
    ForecastProvenance:
      type: object
      additionalProperties: false
      required:
        [
          providerId,
          adapter,
          sourceUrl,
          licenseIdentifier,
          attribution,
          fetchedAt,
        ]
      properties:
        providerId: { type: string, minLength: 1 }
        adapter: { type: string, minLength: 1 }
        sourceUrl: { type: string, format: uri }
        licenseIdentifier: { type: string, minLength: 1 }
        attribution: { type: string, minLength: 1 }
        fetchedAt: { type: integer, format: int64 }
    ForecastRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          systemId,
          kind,
          issuedAt,
          validFrom,
          validTo,
          resolutionSeconds,
          freshness,
          provenance,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        systemId: { $ref: "#/components/schemas/UuidV7" }
        kind: { enum: [forecast, observed, reanalysis] }
        issuedAt: { type: [integer, "null"], format: int64 }
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64 }
        resolutionSeconds: { type: integer, minimum: 1 }
        freshness: { enum: [fresh, stale, unavailable] }
        provenance: { $ref: "#/components/schemas/ForecastProvenance" }
    YieldSeriesPoint:
      type: object
      additionalProperties: false
      required:
        [
          intervalStart,
          intervalEnd,
          centralPowerWatts,
          lowerPowerWatts,
          upperPowerWatts,
          centralEnergyWattHours,
          lowerEnergyWattHours,
          upperEnergyWattHours,
          coverageBasisPoints,
          completeness,
        ]
      properties:
        intervalStart: { type: integer, format: int64 }
        intervalEnd: { type: integer, format: int64 }
        centralPowerWatts: { type: [integer, "null"], format: int64 }
        lowerPowerWatts: { type: [integer, "null"], format: int64 }
        upperPowerWatts: { type: [integer, "null"], format: int64 }
        centralEnergyWattHours: { type: [integer, "null"], format: int64 }
        lowerEnergyWattHours: { type: [integer, "null"], format: int64 }
        upperEnergyWattHours: { type: [integer, "null"], format: int64 }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        completeness: { $ref: "#/components/schemas/ForecastCompleteness" }
    YieldSeries:
      type: object
      additionalProperties: false
      required:
        [
          scope,
          basis,
          resolution,
          issueTime,
          weatherRunId,
          calculationRunId,
          modelIdentifier,
          modelRevision,
          configurationDigest,
          freshness,
          provenance,
          includedCapacityWatts,
          totalEffectiveCapacityWatts,
          completeness,
          unavailableReasons,
          points,
        ]
      properties:
        scope: { $ref: "#/components/schemas/ForecastScope" }
        basis: { enum: [forecast, expected] }
        resolution: { enum: [fifteen_minutes, hour, day] }
        issueTime: { type: [integer, "null"], format: int64 }
        weatherRunId: { $ref: "#/components/schemas/UuidV7" }
        calculationRunId: { $ref: "#/components/schemas/UuidV7" }
        modelIdentifier: { type: string }
        modelRevision: { type: integer, minimum: 1 }
        configurationDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        freshness: { enum: [fresh, stale, unavailable] }
        provenance: { $ref: "#/components/schemas/ForecastProvenance" }
        includedCapacityWatts: { type: integer, format: int64, minimum: 0 }
        totalEffectiveCapacityWatts:
          { type: integer, format: int64, minimum: 0 }
        completeness: { $ref: "#/components/schemas/ForecastCompleteness" }
        unavailableReasons:
          {
            type: array,
            items: { $ref: "#/components/schemas/ForecastCompletenessReason" },
          }
        points:
          {
            type: array,
            maxItems: 10000,
            items: { $ref: "#/components/schemas/YieldSeriesPoint" },
          }
    PerformancePoint:
      type: object
      additionalProperties: false
      required:
        [
          intervalStart,
          intervalEnd,
          actualEnergyWattHours,
          modeledEnergyWattHours,
          ratioBasisPoints,
          actualCoverageBasisPoints,
          modeledCoverageBasisPoints,
          unavailableReason,
        ]
      properties:
        intervalStart: { type: integer, format: int64 }
        intervalEnd: { type: integer, format: int64 }
        actualEnergyWattHours: { type: [integer, "null"], format: int64 }
        modeledEnergyWattHours: { type: [integer, "null"], format: int64 }
        ratioBasisPoints: { type: [integer, "null"], minimum: 0 }
        actualCoverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        modeledCoverageBasisPoints:
          { type: integer, minimum: 0, maximum: 10000 }
        unavailableReason:
          oneOf:
            - { $ref: "#/components/schemas/ForecastCompletenessReason" }
            - { type: "null" }
    PerformanceSeries:
      type: object
      additionalProperties: false
      required:
        [
          scope,
          metric,
          basis,
          resolution,
          issueTime,
          weatherRunId,
          calculationRunId,
          modelIdentifier,
          modelRevision,
          configurationDigest,
          freshness,
          provenance,
          points,
        ]
      properties:
        scope: { $ref: "#/components/schemas/ForecastScope" }
        metric: { enum: [generation_performance, forecast_realization] }
        basis: { enum: [expected, forecast] }
        resolution: { enum: [fifteen_minutes, hour, day] }
        issueTime: { type: [integer, "null"], format: int64 }
        weatherRunId: { $ref: "#/components/schemas/UuidV7" }
        calculationRunId: { $ref: "#/components/schemas/UuidV7" }
        modelIdentifier: { type: string }
        modelRevision: { type: integer, minimum: 1 }
        configurationDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        freshness: { enum: [fresh, stale, unavailable] }
        provenance: { $ref: "#/components/schemas/ForecastProvenance" }
        points:
          {
            type: array,
            maxItems: 10000,
            items: { $ref: "#/components/schemas/PerformancePoint" },
          }
    ForecastProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [field]
          properties:
            field: { type: string }
    SeriesQueryResult:
      type: object
      additionalProperties: false
      required: [actualResolution, timezone, series]
      properties:
        actualResolution:
          { enum: [raw, fifteen_minutes, hourly, daily, monthly, yearly] }
        timezone:
          {
            type: string,
            description: IANA timezone used for calendar bucket boundaries.,
          }
        series: { type: array, items: { $ref: "#/components/schemas/Series" } }
    Series:
      type: object
      additionalProperties: false
      required: [field, unit, points, gaps]
      properties:
        field:
          {
            enum:
              [
                generation_power,
                generation_energy,
                forecast_power,
                forecast_energy,
                expected_energy,
                generation_performance,
                forecast_realization,
                consumption_power,
                consumption_energy,
                grid_power,
                battery_power,
                battery_state_of_charge,
                temperature,
                extended,
                provenance,
              ],
          }
        unit:
          {
            enum:
              [watts, watt_hours, basis_points, milli_degrees_celsius, integer],
          }
        points:
          { type: array, items: { $ref: "#/components/schemas/SeriesPoint" } }
        gaps: { type: array, items: { $ref: "#/components/schemas/SeriesGap" } }
    SeriesPoint:
      type: object
      additionalProperties: false
      required: [timestampEpochMillis, value, coverageBasisPoints, qualityFlags]
      properties:
        timestampEpochMillis: { type: integer, format: int64 }
        value: { type: integer, format: int64 }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        qualityFlags: { type: integer, minimum: 0 }
        provenance:
          {
            type: [string, "null"],
            description: Present only for corrected raw points.,
          }
    SeriesGap:
      type: object
      additionalProperties: false
      required: [startEpochMillis, endEpochMillis, kind]
      properties:
        startEpochMillis: { type: integer, format: int64 }
        endEpochMillis: { type: integer, format: int64 }
        kind: { enum: [missing, suspect, incomplete_coverage] }
    EnergyStatistics:
      type: object
      required: [period, coverageBasisPoints]
      properties:
        period: { enum: [daily, monthly, yearly, lifetime] }
        generationWh: { type: [integer, "null"], minimum: 0 }
        consumptionWh: { type: [integer, "null"], minimum: 0 }
        gridImportWh: { type: [integer, "null"], minimum: 0 }
        gridExportWh: { type: [integer, "null"], minimum: 0 }
        selfConsumptionWh: { type: [integer, "null"], minimum: 0 }
        efficiencyWhPerKw: { type: [integer, "null"], minimum: 0 }
        peakGenerationWatts: { type: [integer, "null"] }
        minimumTemperatureMilliCelsius: { type: [integer, "null"] }
        maximumTemperatureMilliCelsius: { type: [integer, "null"] }
        batteryChargeWh: { type: [integer, "null"], minimum: 0 }
        batteryDischargeWh: { type: [integer, "null"], minimum: 0 }
        minimumBatteryBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        maximumBatteryBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        revenueMinorUnits: { type: [integer, "null"] }
        costMinorUnits: { type: [integer, "null"] }
        netFinancialMinorUnits: { type: [integer, "null"] }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
    DataQualityIssue:
      type: object
      additionalProperties: false
      required: [kind, startEpochMillis, endEpochMillis, sourceReferences]
      properties:
        kind:
          {
            enum:
              [
                missing_interval,
                suspect_observation,
                source_conflict,
                counter_reset,
                rejected_ingestion,
                aggregate_lag,
              ],
          }
        startEpochMillis: { type: integer, format: int64 }
        endEpochMillis: { type: integer, format: int64 }
        sourceReferences: { type: array, items: { type: string } }
        reasonCode: { type: [string, "null"] }
    AnalysisExportRequest:
      type: object
      additionalProperties: false
      required: [startEpochMillis, endEpochMillis, fields, format]
      properties:
        startEpochMillis: { type: integer, format: int64 }
        endEpochMillis: { type: integer, format: int64 }
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
              - generation_power
              - generation_energy
              - forecast_power
              - forecast_energy
              - expected_energy
              - generation_performance
              - forecast_realization
              - consumption_power
              - consumption_energy
              - grid_power
              - battery_power
              - battery_state_of_charge
              - temperature
              - extended
              - provenance
        resolution:
          { enum: [auto, raw, 15m, hour, day, month, year], default: auto }
        timezone: { type: string, default: UTC }
        maximumPoints:
          { type: integer, minimum: 1, maximum: 10000, default: 2000 }
        format: { enum: [csv, json] }
        asynchronous: { type: boolean, default: false }
        weatherRunId: { $ref: "#/components/schemas/UuidV7" }
        includePartial: { type: boolean, default: false }
    QueuedJob:
      type: object
      additionalProperties: false
      required: [jobId]
      properties: { jobId: { $ref: "#/components/schemas/UuidV7" } }
    SystemOverview:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          timezone,
          lifecycle,
          inverterCount,
          stringCount,
          capacityWatts,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        name: { type: string }
        timezone: { type: string }
        lifecycle: { enum: [active, archived, deleting, deleted] }
        inverterCount: { type: integer, minimum: 0 }
        stringCount: { type: integer, minimum: 0 }
        capacityWatts:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Sum of the strings' rated power, or the declared capacity while the system has no strings.
        description: { type: string }
        commissioningDate: { type: [string, "null"], format: date }
        availabilityBasisPoints:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000
        lastSeenEpochMillis: { type: [integer, "null"], format: int64 }
        statusIntervalSeconds: { type: integer, minimum: 30, maximum: 86400 }
        dataState: { $ref: "#/components/schemas/DataState" }
        visibility: { type: string }
    ReportingStatistics:
      type: object
      additionalProperties: false
      required:
        [
          systemId,
          generationEnergyWh,
          consumptionEnergyWh,
          peakGenerationPowerWatts,
          firstObservationAtEpochMillis,
          lastObservationAtEpochMillis,
          coverageBasisPoints,
          monthly,
          yearly,
        ]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        generationEnergyWh: { type: [integer, "null"], format: int64 }
        consumptionEnergyWh: { type: [integer, "null"], format: int64 }
        peakGenerationPowerWatts: { type: [integer, "null"], format: int64 }
        firstObservationAtEpochMillis:
          { type: [integer, "null"], format: int64 }
        lastObservationAtEpochMillis: { type: [integer, "null"], format: int64 }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/MonthlyProduction" }
        yearly:
          type: array
          description: The months summed per local calendar year.
          items: { $ref: "#/components/schemas/YearlyProduction" }
    MonthlyProduction:
      type: object
      additionalProperties: false
      required:
        [
          bucketStartEpochMillis,
          generationEnergyWh,
          consumptionEnergyWh,
          coverageBasisPoints,
          suppliedDays,
        ]
      properties:
        bucketStartEpochMillis: { type: integer, format: int64 }
        generationEnergyWh: { type: [integer, "null"], format: int64 }
        consumptionEnergyWh: { type: [integer, "null"], format: int64 }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        suppliedDays:
          type: integer
          minimum: 0
          description: Days of the month whose value is a daily summary the source supplied rather than computed from interval readings.
    YearlyProduction:
      type: object
      additionalProperties: false
      required: [year, generationEnergyWh, consumptionEnergyWh, suppliedDays]
      properties:
        year: { type: integer }
        generationEnergyWh: { type: [integer, "null"], format: int64 }
        consumptionEnergyWh: { type: [integer, "null"], format: int64 }
        suppliedDays: { type: integer, minimum: 0 }
    DailySummaryInput:
      type: object
      additionalProperties: false
      description: A daily summary as a source reports it. Every member is optional; an absent member means that the value is unknown.
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: "The device the summary describes, as the source names it; for an inverter its serial number. Absent for a summary of the whole system. The summaries a source supplies for its devices are added up to the day's value, which is complete once every one of them is."
        generationEnergyWh: { type: integer, format: int64, minimum: 0 }
        exportEnergyWh: { type: integer, format: int64, minimum: 0 }
        consumptionEnergyWh: { type: integer, format: int64, minimum: 0 }
        generationLifetimeWh:
          type: integer
          format: int64
          minimum: 0
          description: Lifetime generation counter at the end of the day.
        complete:
          type: boolean
          default: false
          description: True once the source states that the day will not change any more. A complete summary is reported in preference to values computed from interval readings.
        peakPowerWatts: { type: integer, format: int64, minimum: 0 }
        peakTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time of the peak.
        weatherCondition: { type: string, maxLength: 40 }
        temperatureMinMillidegreesCelsius: { type: integer, format: int64 }
        temperatureMaxMillidegreesCelsius: { type: integer, format: int64 }
        importEnergyWhByBand:
          type: object
          additionalProperties: false
          description: Imported energy by tariff band.
          properties:
            peak: { type: integer, format: int64, minimum: 0 }
            offPeak: { type: integer, format: int64, minimum: 0 }
            shoulder: { type: integer, format: int64, minimum: 0 }
            highShoulder: { type: integer, format: int64, minimum: 0 }
    DailyValue:
      type: object
      required:
        [date, basis, generationEnergyWh, consumptionEnergyWh, exportEnergyWh]
      properties:
        date: { type: string, format: date }
        basis:
          type: string
          enum: [supplied_complete, computed, supplied_incomplete]
          description: What the reported value is based on. A complete supplied summary is used first, otherwise interval readings that cover at least 80 % of the day, otherwise an incomplete supplied summary.
        generationEnergyWh: { type: [integer, "null"], format: int64 }
        consumptionEnergyWh: { type: [integer, "null"], format: int64 }
        exportEnergyWh: { type: [integer, "null"], format: int64 }
        supplied:
          description: The summary a source supplied for the day. For a source that summarizes its devices it is the sum of their summaries, with a lifetime counter only when every device reported one.
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/DailySummaryInput"
                - type: object
                  properties:
                    dataSourceId:
                      anyOf:
                        - $ref: "#/components/schemas/UuidV7"
                        - type: "null"
                    receivedAtEpochMillis: { type: integer, format: int64 }
            - type: "null"
        suppliedDevices:
          type: array
          description: The summaries of single devices that supplied adds up. Absent when the source summarized the system itself.
          items:
            type: object
            required: [deviceId, complete, receivedAtEpochMillis]
            properties:
              deviceId: { type: string }
              generationEnergyWh: { type: [integer, "null"], format: int64 }
              generationLifetimeWh:
                type: [integer, "null"]
                format: int64
                description: Lifetime generation counter of the device at the end of the day.
              complete: { type: boolean }
              receivedAtEpochMillis: { type: integer, format: int64 }
        computed:
          description: The value computed from interval readings. It stays available while the supplied summary is the one reported.
          anyOf:
            - type: object
              required: [coverageBasisPoints]
              properties:
                generationEnergyWh: { type: [integer, "null"], format: int64 }
                consumptionEnergyWh: { type: [integer, "null"], format: int64 }
                exportEnergyWh: { type: [integer, "null"], format: int64 }
                coverageBasisPoints:
                  { type: integer, minimum: 0, maximum: 10000 }
            - type: "null"
    SeasonalProduction:
      type: object
      additionalProperties: false
      required: [systemId, seasons]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/SeasonProduction" }
    SeasonProduction:
      type: object
      additionalProperties: false
      required: [season, generationEnergyWh, measuredDays, averageDailyEnergyWh]
      properties:
        season: { enum: [winter, spring, summer, autumn] }
        generationEnergyWh: { type: integer, format: int64 }
        measuredDays: { type: integer, minimum: 0 }
        averageDailyEnergyWh: { type: integer, format: int64 }
    WeatherForecastReport:
      type: object
      additionalProperties: false
      required: [systemId, issuedAtEpochMillis, attribution, points]
      properties:
        systemId: { $ref: "#/components/schemas/UuidV7" }
        issuedAtEpochMillis: { type: [integer, "null"], format: int64 }
        attribution: { type: [string, "null"] }
        points:
          type: array
          items: { $ref: "#/components/schemas/WeatherForecastPoint" }
    WeatherForecastPoint:
      type: object
      additionalProperties: false
      required:
        [
          intervalStartEpochMillis,
          intervalEndEpochMillis,
          irradianceWattsPerSquareMetre,
          ambientTemperatureMillicelsius,
          windSpeedMillimetresPerSecond,
          cloudCoverBasisPoints,
          predictedEnergyWh,
        ]
      properties:
        intervalStartEpochMillis: { type: integer, format: int64 }
        intervalEndEpochMillis: { type: integer, format: int64 }
        irradianceWattsPerSquareMetre:
          { type: [integer, "null"], format: int64, minimum: 0 }
        ambientTemperatureMillicelsius:
          { type: [integer, "null"], format: int64 }
        windSpeedMillimetresPerSecond:
          { type: [integer, "null"], format: int64, minimum: 0 }
        cloudCoverBasisPoints:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        predictedEnergyWh: { type: [integer, "null"], format: int64 }
    Dashboard:
      type: object
      additionalProperties: false
      required:
        [
          dataState,
          systemCount,
          observedAtEpochMillis,
          ageSeconds,
          freshnessThresholdSeconds,
          generationWatts,
          consumptionWatts,
          gridWatts,
          batteryBasisPoints,
          coverageBasisPoints,
          recentAlerts,
          ingestion,
        ]
      properties:
        dataState: { $ref: "#/components/schemas/DataState" }
        systemCount:
          type: integer
          minimum: 0
          description: Systems the principal may see.
        observedAtEpochMillis:
          type: integer
          format: int64
          description: Measurement time of the newest reading; zero when dataState is none.
        ageSeconds: { type: integer, minimum: 0 }
        freshnessThresholdSeconds: { type: integer, minimum: 1 }
        generationWatts: { type: number }
        consumptionWatts: { type: [number, "null"] }
        gridWatts: { type: [number, "null"] }
        batteryBasisPoints: { type: [integer, "null"] }
        coverageBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        recentAlerts:
          type: array
          items: { $ref: "#/components/schemas/DashboardAlert" }
        ingestion: { $ref: "#/components/schemas/DashboardIngestion" }
    DashboardAlert:
      type: object
      additionalProperties: false
      required: [id, title, state, openedAtEpochMillis]
      properties:
        id: { type: string }
        title: { type: string }
        state: { enum: [open, resolved] }
        openedAtEpochMillis: { type: integer, format: int64 }
    DashboardIngestion:
      type: object
      additionalProperties: false
      required: [acceptedToday, rejectedToday, lagSeconds]
      properties:
        acceptedToday: { type: integer, minimum: 0 }
        rejectedToday: { type: integer, minimum: 0 }
        lagSeconds: { type: integer, minimum: 0 }
    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: >-
        Canonical lowercase UUID version 7 generated by PVLog. Treat this value
        as opaque; its time-sortable bits do not grant authority or establish an
        authoritative creation timestamp.
      examples:
        - 019505c8-7c85-7f0b-9bc3-2a3c4d5e6f70
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          const: ok
          description: Liveness result.
        service:
          type: string
          description: Process service name.
          examples:
            - pvlog
        version:
          type: string
          description: Running application version.
          examples:
            - 0.1.0
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    Problem:
      type: object
      additionalProperties: true
      description: RFC 9457 problem details.
      required:
        - type
        - title
        - status
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type identifier.
        title:
          type: string
          description: Short human-readable problem title.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Safe occurrence-specific explanation.
        requestId:
          $ref: "#/components/schemas/UuidV7"
