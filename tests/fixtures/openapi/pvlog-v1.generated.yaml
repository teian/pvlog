openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: PVLog REST API
  version: 0.1.0
  summary: Modern self-hosted photovoltaic monitoring API
  description: >-
    The versioned JSON contract for PVLog.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Current PVLog installation
tags:
  - name: Operations
    description: Process and deployment health
  - name: Systems
    description: PV system lifecycle and account-owned configuration
  - name: Equipment Catalog
    description: Offline inverter and solar-module templates with normalized engineering units
  - name: Data Sources
    description: Uploaders and imports that feed a system, their upload credentials and connection health
  - name: Telemetry
    description: Canonical observation ingestion and correction
  - name: Analytics
    description: Resolution-aware time series, statistics, and data quality
  - name: Forecasting
    description: Versioned PV yield settings, weather runs, modeled series, and performance
  - name: Exports
    description: Synchronous and asynchronous analysis exports
  - name: Notifications
    description: Alert rules, events, webhook subscriptions, and delivery attempts
  - name: Authentication
    description: Browser sessions, local authentication, and account API-key lifecycle
  - name: Administration
    description: Authorized account, role, identity, and audit administration
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      description: Confirms that the HTTP process can execute requests.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                live:
                  summary: Live process
                  value:
                    status: ok
                    service: pvlog
                    version: 0.1.0
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Check dependency readiness
      description: Verifies that the configured management and account database topology is available for serving requests.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Required runtime dependencies are ready
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReadinessStatus" } },
            }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/health/version:
    get:
      operationId: getBuildVersion
      summary: Read running build version
      description: Returns process build metadata without checking database or job readiness.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Running process version
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/HealthStatus" } },
            }
        "406": { $ref: "#/components/responses/NotAcceptable" }
  /api/v1/health/dependencies:
    get:
      operationId: getDependencyHealth
      summary: Check required runtime dependencies
      description: Probes the configured management and account database dependencies.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Dependencies are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalHealth" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/health/job-lag:
    get:
      operationId: getJobLagHealth
      summary: Check account job queue lag
      description: Reports whether the durable job queue is within its lag objective.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Job queue is within its configured lag objective
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalHealth" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/health/storage-integrity:
    get:
      operationId: getStorageIntegrityHealth
      summary: Check storage reachability and integrity state
      description: Reports the latest non-mutating database storage probe result.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Storage probe passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalHealth" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/admin/users:
    get:
      operationId: listLocalUsers
      summary: List local users
      description: Returns administrator-visible local user metadata without credentials.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Local users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdministrationUser" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    post:
      operationId: createLocalUser
      summary: Create a local user
      description: Creates an administrator-managed local user without exposing credential material.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "201":
          {
            description: User created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/FreeFormObject" } },
              },
          }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/accounts:
    get:
      operationId: listAdministrationAccounts
      summary: List accounts
      description: Returns every tenant with its status and member and system counts for instance administrators.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdministrationAccount" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/admin/weather-feed:
    get:
      operationId: getWeatherFeedSettings
      tags: [Administration]
      summary: Read the provider-neutral weather feed settings
      description: Returns the configured weather source without resolving or exposing credential secrets.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Weather feed settings
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/WeatherFeedSettings" },
                },
            }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    put:
      operationId: updateWeatherFeedSettings
      tags: [Administration]
      summary: Update the provider-neutral weather feed settings
      description: Persists weather source settings and a reference to separately managed credentials.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WeatherFeedSettings" } },
          }
      responses:
        "200":
          description: Updated weather feed settings
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/WeatherFeedSettings" },
                },
            }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/weather-feed/test:
    post:
      operationId: testWeatherFeedConnection
      tags: [Administration]
      summary: Test weather feed network reachability
      description: Checks whether the configured weather source host and port are reachable.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Reachability result
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ConnectionTestResult" },
                },
            }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/email-notifications:
    get:
      operationId: getEmailNotificationSettings
      tags: [Administration]
      summary: Read SMTP notification settings
      description: Returns SMTP delivery settings while exposing only a credential secret reference.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: SMTP notification settings
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EmailNotificationSettings" },
                },
            }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    put:
      operationId: updateEmailNotificationSettings
      tags: [Administration]
      summary: Update SMTP notification settings
      description: Persists SMTP delivery settings and a reference to separately managed credentials.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/EmailNotificationSettings" },
              },
          }
      responses:
        "200":
          description: Updated SMTP notification settings
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EmailNotificationSettings" },
                },
            }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/email-notifications/test:
    post:
      operationId: testEmailNotificationConnection
      tags: [Administration]
      summary: Test SMTP network reachability
      description: Checks whether the configured SMTP host and port are reachable.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Reachability result
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ConnectionTestResult" },
                },
            }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/retention-backup:
    get:
      operationId: getRetentionBackupSettings
      tags: [Administration]
      summary: Read retention and backup settings
      description: Returns the instance retention period, backup schedule, and last backup metadata.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Retention and backup settings
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/RetentionBackupSettings" },
                },
            }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    put:
      operationId: updateRetentionBackupSettings
      tags: [Administration]
      summary: Update retention and backup settings
      description: Persists the instance retention period and automatic backup schedule.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/RetentionBackupSettings" },
              },
          }
      responses:
        "200":
          description: Updated retention and backup settings
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/RetentionBackupSettings" },
                },
            }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/backups:
    post:
      operationId: runInstanceBackup
      tags: [Administration]
      summary: Run an immediate verified instance backup
      description: Creates a versioned operator bundle. PostgreSQL deployments require an external backup hook and return 501 otherwise.
      security: [{ sessionCookie: [] }]
      responses:
        "201":
          description: Backup completed
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BackupResult" } },
            }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    delete:
      operationId: deleteLocalUser
      summary: Delete a local user
      description: Deletes an eligible local user while preserving takeover and last-administrator protections.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: User deleted }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{id}/activate:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    post:
      operationId: activateLocalUser
      summary: Activate a local user
      description: Activates an invited or administrator-created local user.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "200":
          {
            description: User activated,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/FreeFormObject" } },
              },
          }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    post:
      operationId: disableLocalUser
      summary: Disable a local user
      description: Disables login and revokes active sessions for a local user.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: User disabled }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{id}/unlock:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    post:
      operationId: unlockLocalUser
      summary: Unlock a local user
      description: Clears an administrator-authorized brute-force lockout.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: User unlocked }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    post:
      operationId: setInitialLocalPassword
      summary: Set an initial local password
      description: Sets the initial password under the configured password policy.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/register:
    post:
      operationId: registerLocalUser
      summary: Register a local user
      description: Registers a local user when instance self-registration policy permits it.
      tags: [Authentication]
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "202": { description: Registration accepted }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/password:
    put:
      operationId: changeLocalPassword
      summary: Change the current local password
      description: Changes a password after current-password verification and revokes other sessions.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChangePassword" } },
            },
        }
      responses:
        "204": { description: Password changed; all other sessions are revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/auth/password-recovery:
    post:
      operationId: requestPasswordRecovery
      summary: Request password recovery
      description: Returns an enumeration-resistant acceptance response and emits a single-use token out of band.
      tags: [Authentication]
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "202": { description: Recovery request accepted }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/password-recovery/complete:
    post:
      operationId: completePasswordRecovery
      summary: Complete password recovery
      description: Consumes a single-use recovery token and rotates the local password.
      tags: [Authentication]
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/FreeFormObject" } },
            },
        }
      responses:
        "204": { description: Recovery completed }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/account/profile:
    get:
      operationId: getCurrentUserProfile
      summary: Read the current user's profile
      description: Returns safe identity data for the cookie-authenticated user. No account or user identifier is accepted.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current user's safe profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserProfile" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
    put:
      operationId: updateCurrentUserProfile
      summary: Update the current user's profile
      description: Changes only the current user's display name. Login-email changes require a separate verified workflow and are not accepted here.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCurrentUserProfile" }
      responses:
        "200":
          description: Updated current-user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserProfile" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/account/api-keys:
    get:
      operationId: listAccountApiKeys
      summary: List current-account API keys
      description: Returns safe metadata for API keys owned by the authenticated user's implicit account. Cleartext keys and digests are never returned.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: API-key metadata ordered by newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountApiKey" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
    post:
      operationId: createAccountApiKey
      summary: Create a current-account API key
      description: Creates one independently revocable bearer key. The apiKey property is returned by this operation exactly once and cannot be recovered later.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountApiKey" }
            examples:
              uploadOnly:
                summary: Upload PV telemetry without read or configuration access
                value:
                  name: Home automation uploader
                  scopes: [telemetry:write]
      responses:
        "201":
          description: API key created; copy apiKey now because it is never returned again
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedAccountApiKey" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/account/api-keys/{api_key_id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      operationId: revokeAccountApiKey
      summary: Revoke a current-account API key
      description: Permanently prevents the selected API key from authenticating without affecting other keys.
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: API key revoked }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /api/v1/systems:
    post:
      operationId: createSystem
      tags: [Systems]
      summary: Create a private PV system
      description: Creates one system in the authenticated user's ownership context using private and active defaults. Only the name is required; location, capacity, reporting interval and equipment are optional and can be added later. No separate account identifier is accepted.
      security: [{ bearerAuth: [systems:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSystem" }
            examples:
              nameOnly:
                summary: Only the name is required
                value: { name: Roof PV, clientTimezone: Europe/Berlin }
              withLocation:
                summary: Location and declared capacity
                value:
                  name: Roof PV
                  locationLabel: Leipzig, Germany
                  countryCode: DE
                  latitudeMicrodegrees: 51340000
                  longitudeMicrodegrees: 12370000
                  declaredCapacityWatts: 9900
      responses:
        "201": { $ref: "#/components/responses/SystemResponse" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{id}:
    parameters:
      - $ref: "#/components/parameters/SystemId"
    get:
      operationId: getSystem
      tags: [Systems]
      summary: Read a manageable PV system
      description: Returns mutable system metadata and its current lifecycle version.
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      responses:
        "200": { $ref: "#/components/responses/SystemResponse" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    put:
      operationId: updateSystem
      tags: [Systems]
      summary: Update a PV system
      description: Replaces mutable system settings when the supplied ETag is current.
      security: [{ bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSystem" }
      responses:
        "200": { $ref: "#/components/responses/SystemResponse" }
        "412": { $ref: "#/components/responses/PreconditionProblem" }
    delete:
      operationId: deleteSystem
      tags: [Systems]
      summary: Permanently delete a PV system
      description: Starts confirmed permanent deletion when the supplied ETag is current.
      security: [{ bearerAuth: [systems:write] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - {
            name: X-Confirm-Delete,
            in: header,
            required: true,
            schema: { type: boolean },
          }
      responses:
        "204": { description: System deletion accepted }
        "412": { $ref: "#/components/responses/PreconditionProblem" }
  /api/v1/systems/{id}/archive:
    post:
      operationId: archiveSystem
      tags: [Systems]
      summary: Archive a PV system
      description: Makes an active system inactive without deleting its stored data.
      security: [{ bearerAuth: [systems:write] }]
      parameters:
        - $ref: "#/components/parameters/SystemId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        {
          "200": { $ref: "#/components/responses/SystemResponse" },
          "412": { $ref: "#/components/responses/PreconditionProblem" },
        }
  /api/v1/systems/{id}/restore:
    post:
      operationId: restoreSystem
      tags: [Systems]
      summary: Restore a PV system
      description: Returns an archived system to active service.
      security: [{ bearerAuth: [systems:write] }]
      parameters:
        - $ref: "#/components/parameters/SystemId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        {
          "200": { $ref: "#/components/responses/SystemResponse" },
          "412": { $ref: "#/components/responses/PreconditionProblem" },
        }
  /api/v1/accounts/{account_id}/systems/{system_id}/equipment:
    parameters:
      [
        { $ref: "#/components/parameters/AccountId" },
        { $ref: "#/components/parameters/NestedSystemId" },
      ]
    get:
      {
        operationId: listEquipment,
        summary: List equipment,
        description: Lists effective-dated equipment for one system.,
        tags: [Systems],
        security: [{ bearerAuth: [systems:read] }],
        responses:
          {
            "200": { $ref: "#/components/responses/ResourceList" },
            "403": { $ref: "#/components/responses/ForbiddenProblem" },
          },
      }
    post:
      {
        operationId: createEquipment,
        summary: Create equipment,
        description: Adds validated effective-dated equipment to one system.,
        tags: [Systems],
        security: [{ bearerAuth: [systems:write] }],
        requestBody: { $ref: "#/components/requestBodies/ManagedResource" },
        responses:
          {
            "201": { $ref: "#/components/responses/ManagedResource" },
            "403": { $ref: "#/components/responses/ForbiddenProblem" },
          },
      }
  /api/v1/equipment-catalog/inverters:
    get:
      operationId: listCatalogInverters
      summary: Search bundled inverter templates
      description: Returns deterministic offline results. Catalog values are optional editable prefills, not compatibility or installation approval.
      tags: [Equipment Catalog]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: manufacturer, in: query, schema: { type: string } }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: A bounded catalog page with the bundled revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InverterCatalogPage" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/geocoding/search:
    get:
      operationId: searchAddress
      summary: Resolve an address to coordinates
      description: Performs one explicit, authenticated forward-geocoding request through the operator-configured provider.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 160 },
          }
        - { name: language, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 5, default: 5 },
          }
      responses:
        "200":
          description: Up to five matching OpenStreetMap address suggestions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GeocodingResult" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/equipment-catalog/inverters/{entry_id}:
    get:
      operationId: getCatalogInverter
      summary: Read one inverter template
      description: Returns one bundled inverter template by its stable identifier and reports its source and revision.
      tags: [Equipment Catalog]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Inverter ratings in millivolts, milliamperes, watts, basis points, millimetres and grams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InverterCatalogEntry" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/equipment-catalog/solar-modules:
    get:
      operationId: listCatalogSolarModules
      summary: Search bundled solar-module templates
      description: Returns deterministic offline results for optional editable string prefilling.
      tags: [Equipment Catalog]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: manufacturer, in: query, schema: { type: string } }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: A bounded catalog page with the bundled revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolarModuleCatalogPage" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/equipment-catalog/solar-modules/{entry_id}:
    get:
      operationId: getCatalogSolarModule
      summary: Read one solar-module template
      description: Returns one bundled solar-module template by its stable identifier and reports its source and revision.
      tags: [Equipment Catalog]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Module electrical, thermal and mechanical ratings in normalized integer units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolarModuleCatalogEntry" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }

  /api/v1/data-source-profiles:
    get:
      operationId: listDataSourceProfiles
      summary: List source profiles
      description: Lists the kinds of uploaders and imports this instance can connect, with the configuration snippets each one offers.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: Source profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceProfile" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/systems/{system_id}/setup-status:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: getSystemSetupStatus
      summary: Read the setup status
      description: Returns, in a fixed order, what the system has and what it still needs. The status is derived from stored configuration and telemetry at request time. Only connecting a data source and receiving the first reading are ever recommended; a system that receives data has no recommended item.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/first-data:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: getSystemFirstData
      summary: Verify that the system receives data
      description: Reports whether a reading that is not a test reading is stored, and returns the newest reading in normalized form with the data source it arrived through. While no real reading exists, the newest test reading is returned and marked as such.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: First-data verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirstData" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/data-sources:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listDataSources
      summary: List data sources
      description: Lists the uploaders and imports that feed the system, each with its derived connection state. The response never contains a credential.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataSource" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
    post:
      operationId: createDataSource
      summary: Create a data source
      description: Creates a data source and, for profiles that upload, issues a credential that can only write telemetry for this system. The cleartext credential and the ready-to-use configuration are returned in this response only. An API key that is itself restricted to one system cannot manage data sources.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDataSource" }
            example: { name: Roof logger, profile: smalog }
      responses:
        "201": { $ref: "#/components/responses/IssuedDataSource" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/data-sources/{data_source_id}:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - $ref: "#/components/parameters/DataSourceId"
    get:
      operationId: getDataSource
      summary: Read a data source
      description: Returns one data source with its connection state, the server address and the system identifier, and no credential.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: Data source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
    put:
      operationId: renameDataSource
      summary: Rename a data source
      description: Changes the name of a data source. Its credential and readings are unaffected.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameDataSource" }
      responses:
        "200":
          description: Renamed data source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    delete:
      operationId: deleteDataSource
      summary: Delete a data source
      description: Removes the data source and revokes its credential. Readings it delivered are kept and stay attributed to it.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      responses:
        "204": { description: Data source deleted }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/data-sources/{data_source_id}/credential:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - $ref: "#/components/parameters/DataSourceId"
    post:
      operationId: regenerateDataSourceCredential
      summary: Regenerate the credential of a data source
      description: Issues a new credential and invalidates the previous one immediately. The new cleartext credential and configuration are returned in this response only.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      responses:
        "200": { $ref: "#/components/responses/IssuedDataSource" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/data-sources/{data_source_id}/test-reading:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - $ref: "#/components/parameters/DataSourceId"
    post:
      operationId: sendDataSourceTestReading
      summary: Send a test reading
      description: Stores one clearly marked test reading for the data source. Test readings are kept apart from telemetry and never enter a total, statistic or forecast.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      responses:
        "201":
          description: Test reading stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestReading" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/test-readings:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    delete:
      operationId: deleteTestReadings
      summary: Remove test readings
      description: Removes every test reading of the system. Real readings are never affected.
      tags: [Data Sources]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      responses:
        "204": { description: Test readings removed }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/systems/{system_id}/channels:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listMeasurementChannels
      summary: List measurement channels
      description: Lists every measurement channel seen for the system, including unassigned ones, with the equipment each is bound to.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      responses:
        "200":
          description: Measurement channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementChannel" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/ingest/capabilities:
    get:
      operationId: getIngestCapabilities
      summary: Read what the ingestion API accepts
      description: Returns the schema versions, the limits of one request and the content encodings the ingestion API accepts, so that a logger can adapt to the server instead of assuming them. Any authenticated client may ask.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Capabilities of the ingestion API
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestCapabilities" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
  /api/v1/systems/{system_id}/ingest:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    post:
      operationId: ingest
      summary: Deliver what a logger has
      description: |-
        Accepts in one request the devices a logger reads, their measurements, archive energy samples, daily summaries and events. Values are integers in the unit their member name states, times are epoch seconds, and an absent member means that the value is missing; it is never read as zero.

        Items are identified by what they describe: a measurement by its time, an energy sample by device and time, a daily summary by device and date, an event by device and event identifier. Sending an item again stores nothing; sending it with other values replaces what was stored. No idempotency key is needed.

        The request is checked completely before anything is stored. A member the schema version does not define, a list longer than its limit or an item that cannot be stored refuses the whole request, and the problem names the member, the limit, or every such item by list, position and reason.

        Values of devices are stored as measurement channels under the key scheme of the source profiles. The system's generation power, lifetime and interval energy, grid power and battery state are derived from the devices that reported them; a value stated in `system` wins. Interval energy is not derived across a counter reset or a change in the set of reporting devices.

        The body may be compressed with gzip or zstd, named in Content-Encoding. The limits are published by the capabilities resource.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:write] }]
      parameters:
        - name: Content-Encoding
          in: header
          description: Encoding of the request body.
          schema: { type: string, enum: [identity, gzip, zstd] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "200":
          description: What became of the items, and the marks to continue from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "400": { $ref: "#/components/responses/IngestProblem" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "413": { $ref: "#/components/responses/IngestProblem" }
        "415": { $ref: "#/components/responses/IngestProblem" }
        "422": { $ref: "#/components/responses/IngestProblem" }
        "503": { $ref: "#/components/responses/IngestProblem" }
  /api/v1/systems/{system_id}/ingest/state:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: getIngestState
      summary: Read how far a logger has delivered
      description: Returns, for the data source of the calling credential, the latest measurement time, sample time, summary date and event time PVLog holds per device. A logger that lost its own state continues from these marks. The marks of another data source of the same system are not included.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:write] }]
      responses:
        "200":
          description: Marks of the calling data source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestMarks" }
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/device-events:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    post:
      operationId: storeDeviceEvents
      summary: Upload device events
      description: Stores the events devices reported, such as a fault or a changed setting. An event is identified by its device and its eventId, or by its time and code when the source has no identifier, so uploading it again stores nothing new. An event that is uploaded again with other content replaces the stored one. Either all events of a request are stored or none.
      tags: [Telemetry]
      security: [{ bearerAuth: [telemetry:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/DeviceEventInput" }
            example:
              events:
                - deviceId: "2000123456"
                  eventId: "8812"
                  occurredAtEpochMillis: 1780000000000
                  code: 3501
                  message: Insulation failure
      responses:
        "200":
          description: What became of the events
          content:
            application/json:
              schema:
                type: object
                required: [stored, unchanged]
                properties:
                  stored:
                    type: integer
                    description: Events that were new, or replaced a stored event with other content.
                  unchanged:
                    type: integer
                    description: Events that were already stored as uploaded.
        "401": { $ref: "#/components/responses/UnauthorizedProblem" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
    get:
      operationId: listDeviceEvents
      summary: List device events
      description: Lists the device events of a system, newest first.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:read] }]
      parameters:
        - name: deviceId
          in: query
          description: Only events of this device.
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceEventFrom"
        - $ref: "#/components/parameters/DeviceEventTo"
        - $ref: "#/components/parameters/DeviceEventLimit"
      responses:
        "200":
          description: Device events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceEvent" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/inverters/{inverter_id}/device-events:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - name: inverter_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UuidV7" }
    get:
      operationId: listInverterDeviceEvents
      summary: List the device events of an inverter
      description: Lists the events of the device whose identifier is the inverter's serial number, newest first. An inverter without a serial number has none.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:read] }]
      parameters:
        - $ref: "#/components/parameters/DeviceEventFrom"
        - $ref: "#/components/parameters/DeviceEventTo"
        - $ref: "#/components/parameters/DeviceEventLimit"
      responses:
        "200":
          description: Device events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceEvent" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/energy-samples:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listEnergySamples
      summary: List archive energy samples
      description: Lists the archive energy samples a data source delivered through the ingestion API, oldest first. A sample keeps a device's lifetime energy counter and mean power as the device archived them; where no live measurement was stored for its time, it also contributes to the derived interval energy of the system.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:read] }]
      parameters:
        - name: deviceId
          in: query
          description: Only samples of this device.
          schema: { type: string }
        - name: from
          in: query
          description: Only samples measured at or after this instant, in epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          description: Only samples measured before this instant, in epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: Energy samples, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnergySample" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/discovery-proposals:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listDiscoveryProposals
      summary: List equipment discovery proposals
      description: Lists the devices a data source reported that match no inverter of the system. A device is proposed when a measurement channel of the device key scheme is first seen for its serial. No equipment is created until a proposal is adopted. Trackers are the DC inputs whose power has been other than zero at least once.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - name: includeDismissed
          in: query
          description: Also lists dismissed proposals.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Proposals, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveryProposal" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
  /api/v1/systems/{system_id}/discovery-proposals/{proposal_id}/adopt:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - $ref: "#/components/parameters/DiscoveryProposalId"
    post:
      operationId: adoptDiscoveryProposal
      summary: Adopt a discovery proposal
      description: Creates an inverter with the device's serial and the requested strings, and binds the device's unassigned measurement channels. The channels of a tracker go to the string created for it; all other channels of the device go to the inverter. A channel that was bound by hand keeps its binding.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:write] }]
      parameters: [{ $ref: "#/components/parameters/OptionalCsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryAdoption" }
            example:
              name: Roof inverter
              strings:
                - tracker: 1
                  name: East
                  capacityWatts: 4400
                  orientationDegrees: 90
                  tiltDegrees: 30
                - tracker: 5
                  capacityWatts: 3000
      responses:
        "201":
          description: Created equipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptedEquipment" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409":
          description: The proposal is not open, or an inverter with the serial exists by now.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/discovery-proposals/{proposal_id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - $ref: "#/components/parameters/DiscoveryProposalId"
    post:
      operationId: dismissDiscoveryProposal
      summary: Dismiss a discovery proposal
      description: Dismisses an open proposal. The device is not proposed again, whatever it reports, until the dismissal is reset.
      tags: [Systems]
