    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listChannelAggregates
      summary: List aggregates of bound measurement channels
      description: Lists, for the system, one inverter or one string, the aggregates of every measurement channel bound to it. Buckets follow the local calendar of the system. Each bucket reports the value its channel's aggregation kind yields, together with the minimum, the maximum and the number of values. Aggregates are built by the worker shortly after readings arrive and are rebuilt under the new target when a channel is rebound.
      tags: [Systems]
      security: [{ sessionCookie: [] }, { bearerAuth: [systems:read] }]
      parameters:
        - name: targetKind
          in: query
          required: true
          schema: { type: string, enum: [plant, inverter, string] }
        - name: targetId
          in: query
          description: Inverter or string identifier. Required for those targets and not allowed for the plant.
          schema: { $ref: "#/components/schemas/UuidV7" }
        - name: resolution
          in: query
          required: true
          schema:
            type: string
            enum: [fifteen_minute, hour, day, month, year]
        - name: from
          in: query
          required: true
          description: Start of the range in epoch milliseconds, inclusive. A bucket belongs to the range when it starts within it.
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          required: true
          description: End of the range in epoch milliseconds, exclusive.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Aggregates per channel, ordered by channel key. A channel without a value in the range is left out.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelAggregate" }
