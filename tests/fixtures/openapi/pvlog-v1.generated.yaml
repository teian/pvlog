  /api/v1/systems/{system_id}/observations:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    post:
      operationId: createObservation
      summary: Ingest one observation
      description: Normalizes and durably stores one idempotent canonical observation. Account API keys require the telemetry:write scope and standard bearer authentication. Query credentials are rejected before ingestion. An absent member means that the value is unknown and is never read as zero. A rejected member is named by its wire name in the detail of the validation problem.
      tags: [Telemetry]
      security: [{ bearerAuth: [telemetry:write] }]
      x-codeSamples:
        - lang: Shell
          label: Account API key
          source: |-
            curl --fail-with-body \
              -H 'content-type: application/json' \
              -H 'idempotency-key: reading-1780000000000' \
              -H 'authorization: Bearer pvlog_REDACTED' \
              --data '{"observedAtEpochMillis":1780000000000,"generationPowerWatts":4200}' \
              https://pvlog.example/api/v1/systems/SYSTEM_ID/observations
      parameters:
        [
          {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1 },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ObservationInput" },
                  example:
                    {
                      observedAtEpochMillis: 1780000000000,
                      generationPowerWatts: 4200,
                      generationEnergyWh: 350,
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: Observation accepted. The stored reading is returned; rejectedChannels is present when a channel value was left out.,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          properties:
                            {
                              rejectedChannels:
                                {
                                  type: array,
                                  items:
                                    {
                                      $ref: "#/components/schemas/RejectedChannel",
                                    },
                                },
                            },
                        },
                    },
                },
            },
          "422": { $ref: "#/components/responses/ValidationProblem" },
          "401": { $ref: "#/components/responses/UnauthorizedProblem" },
          "429": { $ref: "#/components/responses/RateLimitProblem" },
          "503": { $ref: "#/components/responses/OverloadProblem" },
        }
  /api/v1/systems/{system_id}/daily-summaries:
    parameters: [{ $ref: "#/components/parameters/NestedSystemId" }]
    get:
      operationId: listDailyValues
      summary: List daily values
      description: Lists the local days in the range that have a supplied summary or a value computed from interval readings, each with the value it reports and what that value is based on.
      tags: [Telemetry]
      security: [{ sessionCookie: [] }, { bearerAuth: [telemetry:read] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Last date of the range, inclusive.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily values, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyValue" }
        "403": { $ref: "#/components/responses/ForbiddenProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
  /api/v1/systems/{system_id}/daily-summaries/{date}:
    parameters:
      - $ref: "#/components/parameters/NestedSystemId"
      - name: date
        in: path
        required: true
        description: Local calendar date in the system's timezone.
        schema: { type: string, format: date }
    put:
      operationId: supplyDailySummary
      summary: Supply a daily summary
      description: Stores the summary a source reports for one local date. Supplying a summary again for the same date replaces the earlier one of the same source and device, so a running day can be updated until it is marked complete. The summary is kept next to the value computed from interval readings; the response states which of the two the day reports.
      tags: [Telemetry]
      security: [{ bearerAuth: [telemetry:write] }]
      requestBody:
