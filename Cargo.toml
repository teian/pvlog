[workspace]
resolver = "3"
members = [
    "src/crates/api",
    "src/crates/application",
    "src/crates/domain",
    "src/crates/pvlog",
    "src/crates/sbfspot-push",
    "src/crates/storage",
    "src/crates/worker",
    "tests/rust/config",
    "tests/support/rust/application-fakes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/pvlog/pvlog"

[workspace.dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["http2", "json", "macros", "multipart", "query", "tokio"] }
blake3 = "=1.8.7"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
chacha20poly1305 = "=0.11.0"
clap = { version = "=4.6.7", features = ["derive", "env", "unicode", "wrap_help"] }
dotenvy = "=0.15.7"
flate2 = "=1.1.11"
figment = { version = "=0.10.19", features = ["env", "json", "toml"] }
opentelemetry = { version = "=0.33.1", features = ["metrics", "trace"] }
opentelemetry-otlp = "=0.33.1"
opentelemetry_sdk = { version = "=0.33.1", features = ["rt-tokio", "spec_unstable_metrics_views"] }
rust-embed = "=8.13.0"
openidconnect = { version = "=4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
prost = "=0.14.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["buffer", "limit", "load-shed", "timeout", "util"] }
tower-http = { version = "=0.7.1", features = ["compression-full", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = { version = "=0.1.44", features = ["attributes"] }
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
url = { version = "=2.5.8", features = ["serde"] }
utoipa = { version = "=6.0.0", features = ["axum_extras", "time", "url", "uuid", "yaml"] }
uuid = { version = "=1.29.2", features = ["serde", "std", "v4", "v7"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
zstd = "=0.14.3"

[workspace.dependencies.tempfile]
version = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unwrap_used = "warn"
